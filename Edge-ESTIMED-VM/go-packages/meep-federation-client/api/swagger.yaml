        version: version
    SystemInfoUpdate:
      title: SystemInfoUpdate
      type: object
      properties:
        systemName:
          type: string
          description: The name of the MEC system. This is how the MEC system identifies
            other MEC systems.
        endpoint:
          $ref: '#/components/schemas/EndPointInfo'
      description: "This type represents an information provided by MEC orchestrator\
        \ as a part of the \nUpdate of MEC system(s) to the federation.\n"
    EndPointInfo:
      title: EndPointInfo
      type: object
      properties:
        uris:
          type: array
          description: "Entry point information of the service as string, formatted\
            \ according to URI syntax (see IETF RFC 3986 [8]). Shall be used for REST\
            \ APIs. See note."
          items:
            type: string
        fqdn:
          type: array
          description: Fully Qualified Domain Name of the service. See note.
          items:
            type: string
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Addresses'
        alternative:
          type: string
          description: "Entry point information of the service in a format defined\
            \ by an implementation, or in an external specification. See\_note."
      description: "NOTE: Exactly one of \"uris\", \"fqdn\", \"addresses\" or \"alternative\"\
        \ shall be present. \n"
      example:
        uris:
        - uris
        - uris
        addresses:
        - port: 0
          host: host
        - port: 0
          host: host
        fqdn:
        - fqdn
        - fqdn
        alternative: alternative
    Addresses:
      required:
      - host
      - port
      type: object
      properties:
        host:
          type: string
          description: Host portion of the address.
        port:
          type: integer
          description: Port portion of the address.
      description: Entry point information of the service as one or more pairs of
        IP address and port. See note.
      example:
        port: 0
        host: host
    SystemUpdateNotificationSubscription:
      title: SystemUpdateNotificationSubscription
      required:
      - callbackReference
      - subscriptionType
      type: object
      properties:
        subscriptionType:
          type: string
          description: Shall be set to "SystemUpdateNotificationSubscription".
        callbackReference:
          type: string
          description: URI selected by the MEC orchestrator to receive notifications
            on the subscribed MEC system information updates in the MEC federation.
            This shall be included in both the request and the response.
          format: uri
        links:
          $ref: '#/components/schemas/links'
        systemId:
          minItems: 0
          type: array
          description: "Identifier(s) to uniquely specify the target MEC system(s)\
            \ for the subscription. If absent, the subscription should include all\
            \ MEC systems in the MEC federation."
          items:
            type: string
        expiryDeadline:
          $ref: '#/components/schemas/TimeStamp'
      description: This type represents a subscription to the notifications from the
        MEC federator related to information update of the MEC systems in the MEC
        federation.
      example:
        systemId:
        - systemId
        - systemId
        subscriptionType: subscriptionType
        callbackReference: http://example.com/aeiou
        expiryDeadline:
          seconds: 0
          nanoSeconds: 6
        links:
          self:
            href: http://example.com/aeiou
    SystemUpdateNotification:
      title: SystemUpdateNotification
      required:
      - links
      - notificationType
      - updatedSystemInfo
      type: object
      properties:
        notificationType:
          type: string
          description: Shall be set to "SystemUpdateNotification".
        updatedSystemInfo:
          minItems: 1
          type: array
          description: Updated information of the MEC system(s) in the MEC federation.
          items:
            $ref: '#/components/schemas/SystemInfo'
        links:
          $ref: '#/components/schemas/links1'
      description: This type represents the information that the MEC federator notifies
        the subscribed MEC orchestrator about the information update of the MEC systems
        in the MEC federation.
    TimeStamp:
      title: TimeStamp
      required:
      - nanoSeconds
      - seconds
      type: object
      properties:
        seconds:
          type: integer
          description: "The seconds part of the time. Time is defined as Unixtime\
            \ since January 1, 1970, 00:00:00 UTC."
          format: uint32
        nanoSeconds:
          type: integer
          description: "The nanoseconds part of the time. Time is defined as Unix-time\
            \ since January 1, 1970, 00:00:00 UTC."
          format: uint32
      description: The expiration time of the subscription determined by the MEC Federation
        Enablement Service.
      example:
        seconds: 0
        nanoSeconds: 6
    links:
      title: links
      required:
      - self
      type: object
      properties:
        self:
          $ref: '#/components/schemas/LinkType'
      description: Object containing hyperlinks related to the resource. This shall
        only be included in the HTTP responses.
      example:
        self:
          href: http://example.com/aeiou
    links1:
      title: links1
      required:
      - subscription
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/LinkType'
      description: Object containing hyperlinks related to the resource.
    LinkType:
      title: LinkType
      required:
      - href
      type: object
      properties:
        href:
          type: string
          description: URI referring to a resource.
          format: uri
      description: Self-referring URI. The URI shall be unique within the MEC Federation
        Enablement API as it acts as an ID for the subscription (SubscriptionId).
      example:
        href: http://example.com/aeiou
    SubscriptionLinkList:
      required:
      - _links
      type: object
      properties:
        _links:
