openapi: 3.0.2
info:
  title: AdvantEDGE MEC Application Support API
  version: 3.1.1
  description: "MEC Application Support Service is AdvantEDGE's implementation of\
    \ [ETSI MEC ISG MEC011 Application Enablement API](https://www.etsi.org/deliver/etsi_gs/MEC/001_099/011/03.01.01_60/gs_MEC011v030101p.pdf)\
    \ <p>[Copyright (c) ETSI 2024](https://forge.etsi.org/etsi-forge-copyright-notice.txt)\
    \ <p>**Micro-service**<br>[meep-app-enablement](https://github.com/InterDigitalInc/AdvantEDGE/tree/master/go-apps/meep-app-enablement/server/app-support)\
    \ <p>**Type & Usage**<br>Edge Service used by edge applications that want to get\
    \ information about applications in the network <p>**Note**<br>AdvantEDGE supports\
    \ a selected subset of Application Support API endpoints (see below)."
  license:
    name: Apache 2.0
    url: 'https://github.com/InterDigitalInc/AdvantEDGE/blob/master/LICENSE'
  contact:
    name: InterDigital AdvantEDGE Support
    email: AdvantEDGE@InterDigital.com
externalDocs:
  description: 'ETSI GS MEC011 Application Enablement API, V3.1.1'
  url: https://www.etsi.org/deliver/etsi_gs/MEC/001_099/011/03.01.01_60/gs_MEC011v030101p.pdf
servers:
  - url: 'https://localhost/sandboxname/mec_app_support/v2'
tags:
  - name: mec_app_support
  - name: unsupported
  - name: callbacks
paths:
  /applications/{appInstanceId}/traffic_rules:
    get:
      tags:
        - unsupported
      summary: Retrieve information about a list of mecTrafficRule resources for an application instance
      description: >-
        This method retrieves information about all the traffic rules associated with a MEC application instance.
      operationId: ApplicationsTrafficRules_GET
      parameters:
        - name: appInstanceId
          in: path
          description: >-
            Represents a MEC application instance. Note that the appInstanceId is allocated by the MEC platform manager.
          required: true
          style: simple
          schema:
            type: string
      responses:
        '200':
          description: >-
            Upon success, a response message content containing an array of the
            TrafficRules is returned.
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrafficRule'
                description: ''
                example:
                  - - trafficRuleId: TrafficRule123
                      filterType: FLOW
                      priority: 1
                      trafficFilter:
                        - srcAddress:
                            - 192.127.4.100/32
                            - 192.127.4.101/32
                          dstAddress:
                            - 192.127.4.102/32
                            - 192.127.4.103/32
                          srcPort:
                            - '80'
                          dstPort:
                            - '80'
                      action: FORWARD_DECAPSULATED
                      dstInterface:
                        - dstInterface: null
                          interfaceType: IP
                          tunnelInfo: tunnel
                          dstIpAddress: 20.1.1.1
                      state: ACTIVE
              example:
                TrafficRules:
                  value:
                    - trafficRuleId: TrafficRule123
                      filterType: FLOW
                      priority: 1
                      trafficFilter:
                        - srcAddress:
                            - 192.127.4.100/32
                            - 192.127.4.101/32
                          dstAddress:
                            - 192.127.4.102/32
                            - 192.127.4.103/32
                          srcPort:
                            - '80'
                          dstPort:
                            - '80'
                      action: FORWARD_DECAPSULATED
                      dstInterface:
                        - dstInterface: null
                          interfaceType: IP
                          tunnelInfo: tunnel
                          dstIpAddress: 20.1.1.1
                      state: ACTIVE
                    - trafficRuleId: TrafficRule123
                      filterType: FLOW
                      priority: 1
                      trafficFilter:
                        - srcAddress:
                            - 192.127.4.104/32
                            - 192.127.4.105/32
                          dstAddress:
                            - 192.127.4.106/32
                            - 192.127.4.107/32
                          srcPort:
                            - '80'
                          dstPort:
                            - '80'
                      action: FORWARD_DECAPSULATED
                      dstInterface:
                        - dstInterface: null
                          interfaceType: IP
                          tunnelInfo: tunnel
                          dstIpAddress: 20.1.1.2
                      state: ACTIVE
        '400':
          description: >-
            Bad Request. It is used to indicate that incorrect parameters were passed to the request.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
        '403':
          description: >-
            Forbidden. The operation is not allowed given the current status of the resource.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            Not Found. It is used when a client provided a URI that cannot be
            mapped  to a valid resource URI.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
      deprecated: false
    parameters: []
  /applications/{appInstanceId}/traffic_rules/{trafficRuleId}:
    get:
      tags:
        - unsupported
