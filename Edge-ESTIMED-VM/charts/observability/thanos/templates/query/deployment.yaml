{{- if .Values.query.enabled }}
{{- $queryServerKeyMap := .Values.query.grpcTLS.server.existingSecret.keyMapping | default dict }}
{{- $queryClientKeyMap := .Values.query.grpcTLS.client.existingSecret.keyMapping | default dict }}
{{- $hasCompatMounts := or .Values.query.sdConfig .Values.query.existingSDConfigmap .Values.query.grpcTLS.server.secure .Values.query.grpcTLS.server.existingSecret.name .Values.query.grpcTLS.client.secure .Values.query.grpcTLS.client.existingSecret.name }}
{{- $hasExtraMounts := or (gt (len (.Values.global.extraVolumeMounts | default list)) 0) (gt (len (.Values.query.extraVolumeMounts | default list)) 0) }}
{{- $hasExtraVolumes := or (gt (len (.Values.global.extraVolumes | default list)) 0) (gt (len (.Values.query.extraVolumes | default list)) 0) }}
{{- $hasCompatVolumes := $hasCompatMounts }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thanos.compName" (list . "query") }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    {{- with .Values.query.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- include "thanos.annotations" (dict "Values" .Values "component" "query") | nindent 4 }}
    {{- with .Values.query.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.query.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: query
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "thanos.labels" . | nindent 8 }}
        app.kubernetes.io/component: query
        {{- include "thanos.podLabels" (dict "root" . "key" "query") | nindent 8 }}
      annotations:
        {{- if or .Values.query.sdConfig .Values.query.existingSDConfigmap }}
        checksum/query-sd-config: {{ include (print $.Template.BasePath "/query/sd-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "thanos.serviceAccountName" . }}
      {{- include "thanos.affinity" (dict "Values" .Values "component" "query") | nindent 6 }}
      {{- include "thanos.imagePullSecrets" . | nindent 6 }}
      {{- include "thanos.podSC" (dict "root" . "key" "query") | nindent 6 }}
      containers:
        - name: query
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            - query
            - --http-address=0.0.0.0:{{ .Values.query.service.httpPort }}
            - --grpc-address=0.0.0.0:{{ .Values.query.service.grpcPort }}
        {{- if or .Values.query.sdConfig .Values.query.existingSDConfigmap }}
            - --store.sd-files=/conf/servicediscovery.yml
        {{- end }}
        {{- if .Values.query.endpoints.autogen.enabled }}
          {{- if .Values.storegateway.enabled }}
            # - --endpoint={{ include "thanos.compName" (list . "storegateway") }}:{{ .Values.storegateway.service.grpcPort }}
            - --endpoint=dnssrv+_grpc._tcp.{{ include "thanos.compName" (list . "storegateway") }}.{{ .Release.Namespace }}.svc.{{ .Values.global.clusterDomain }}
          {{- end }}
          {{- if .Values.receive.enabled }}
            - --endpoint=dnssrv+_grpc._tcp.{{ include "thanos.receiveHeadless" . }}.{{ .Release.Namespace }}.svc.{{ .Values.global.clusterDomain }}
          {{- end }}
          {{- if .Values.ruler.enabled }}
            - --endpoint=dnssrv+_grpc._tcp.{{ include "thanos.compName" (list . "ruler") }}-headless.{{ .Release.Namespace }}.svc.{{ .Values.global.clusterDomain }}
          {{- end }}
        {{- end }}
          {{- range .Values.query.endpoints.static }}
            - --endpoint={{ . }}
          {{- end }}
          {{- range .Values.query.stores }}
            - --endpoint={{ . }}
          {{- end }}
          {{- range .Values.query.replicaLabels }}
            - --query.replica-label={{ . }}
          {{- end }}
          {{- range .Values.query.extraArgs }}
            - {{ . | quote }}
          {{- end }}
          {{- if or .Values.query.grpcTLS.server.secure .Values.query.grpcTLS.server.existingSecret.name }}
            - --grpc-server-tls-cert=/tls/server/{{ index $queryServerKeyMap "tls-cert" | default "tls-cert" }}
            - --grpc-server-tls-key=/tls/server/{{ index $queryServerKeyMap "tls-key" | default "tls-key" }}
            {{- if or .Values.query.grpcTLS.server.ca .Values.query.grpcTLS.server.existingSecret.name }}
            - --grpc-server-tls-client-ca=/tls/server/{{ index $queryServerKeyMap "ca-cert" | default "ca-cert" }}
            {{- end }}
          {{- end }}
          {{- if or .Values.query.grpcTLS.client.secure .Values.query.grpcTLS.client.existingSecret.name }}
            - --grpc-client-tls-secure
            {{- if or .Values.query.grpcTLS.client.cert .Values.query.grpcTLS.client.existingSecret.name }}
            - --grpc-client-tls-cert=/tls/client/{{ index $queryClientKeyMap "tls-cert" | default "tls-cert" }}
            {{- end }}
            {{- if or .Values.query.grpcTLS.client.key .Values.query.grpcTLS.client.existingSecret.name }}
            - --grpc-client-tls-key=/tls/client/{{ index $queryClientKeyMap "tls-key" | default "tls-key" }}
            {{- end }}
            {{- if or .Values.query.grpcTLS.client.ca .Values.query.grpcTLS.client.existingSecret.name }}
            - --grpc-client-tls-ca=/tls/client/{{ index $queryClientKeyMap "ca-cert" | default "ca-cert" }}
            {{- end }}
          {{- end }}
          {{- if .Values.query.grpcTLS.client.servername }}
            - --grpc-client-server-name={{ .Values.query.grpcTLS.client.servername }}
          {{- end }}
          {{- include "thanos.extraEnvBlock" (dict "Values" .Values "component" "query") | nindent 10 }}
          {{- include "thanos.extraEnvFromBlock" (dict "Values" .Values "component" "query") | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.query.service.httpPort }}
            - name: grpc
              containerPort: {{ .Values.query.service.grpcPort }}
          {{- if or $hasCompatMounts $hasExtraMounts }}
          volumeMounts:
            {{- if or .Values.query.sdConfig .Values.query.existingSDConfigmap }}
            - name: sd-config
              mountPath: /conf/servicediscovery.yml
              subPath: servicediscovery.yml
            {{- end }}
            {{- if or .Values.query.grpcTLS.server.secure .Values.query.grpcTLS.server.existingSecret.name }}
            - name: tls-server
              mountPath: /tls/server
            {{- end }}
            {{- if or .Values.query.grpcTLS.client.secure .Values.query.grpcTLS.client.existingSecret.name }}
            - name: tls-client
              mountPath: /tls/client
            {{- end }}
            {{- include "thanos.extraMountItems" (dict "root" . "key" "query") | nindent 12 }}
          {{- end }}
          {{- include "thanos.containerSC" (dict "root" . "key" "query") | nindent 10 }}
          resources:
            {{- toYaml .Values.query.resources | nindent 12 }}
          {{- include "thanos.httpProbes" (dict "root" . "key" "query") | nindent 10 }}
        {{- include "thanos.extraContainers" (dict "Values" .Values "component" "query" "root" .) | nindent 8 }}
      {{- include "thanos.dnsConfig" (dict "Values" .Values "component" "query") | nindent 6 }}
      {{- include "thanos.initContainers" (dict "Values" .Values "component" "query" "root" .) | nindent 6 }}
      {{- include "thanos.nodeSelector" (dict "Values" .Values "component" "query") | nindent 6 }}
      {{- include "thanos.priorityClassName" (dict "Values" .Values "component" "query") | nindent 6 }}
      {{- include "thanos.tolerations" (dict "Values" .Values "component" "query") | nindent 6 }}
      {{- include "thanos.topologySpreadConstraints" (dict "Values" .Values "component" "query") | nindent 6 }}
      {{- if or $hasCompatVolumes $hasExtraVolumes }}
      volumes:
        {{- if or .Values.query.sdConfig .Values.query.existingSDConfigmap }}
        - name: sd-config
          configMap:
            name: {{ .Values.query.existingSDConfigmap | default (printf "%s-query-sd-configmap" (include "thanos.fullname" .)) }}
        {{- end }}
        {{- if or .Values.query.grpcTLS.server.secure .Values.query.grpcTLS.server.existingSecret.name }}
        - name: tls-server
          secret:
            secretName: {{ .Values.query.grpcTLS.server.existingSecret.name | default (printf "%s-query-tls-server" (include "thanos.fullname" .)) }}
        {{- end }}
        {{- if or .Values.query.grpcTLS.client.secure .Values.query.grpcTLS.client.existingSecret.name }}
        - name: tls-client
          secret:
            secretName: {{ .Values.query.grpcTLS.client.existingSecret.name | default (printf "%s-query-tls-client" (include "thanos.fullname" .)) }}
        {{- end }}
        {{- include "thanos.extraVolumeItems" (dict "root" . "key" "query") | nindent 8 }}
      {{- end }}
{{- end }}
