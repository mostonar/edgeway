# Default values for meep-cloud-mosquitto
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deployment:
  replicas: 1
  port: 1883
  protocol: TCP
  dependencies:
    system:
      {{- if not .IsMepService }}
      - kube-dns
      {{- end }}
    namespace:

image:
  repository: meep-docker-registry:30001/meep-cloud-mosquitto
  tag: latest
  pullPolicy: Always
  # entrypointScript: /entrypoint.sh
  env:
    MEAS_REP_UE_PERIODIC_TRIGGER_INTERVAL: 1s
    NR_MEAS_REP_UE_PERIODIC_TRIGGER_INTERVAL: 1s
    MEEP_INSTANCE_ID: {{.InstanceId}}
    MEEP_SANDBOX_NAME: {{.SandboxName}}
    MEEP_HOST_URL: {{.HostUrl}}
    {{- if .IsMepService }}
    MEEP_LOCATION_NAME: {{.LocationName}}
    {{- end }}
    {{- if eq .AppEnablement "local" }}
    MEEP_APP_ENABLEMENT: {{.LocationName}}-meep-app-enablement
    {{- else if eq .AppEnablement "global" }}
    MEEP_APP_ENABLEMENT: meep-app-enablement
    {{- end }}
    {{- range .Env}}
    {{.}}
    {{- end}}

service:
  name: meep-cloud-mosquitto
  # type: ClusterIP
  # port: 80
  type: NodePort
  port: 1883
  NodePort: ""

ingress:
  enabled: true
  hosts:
    - name: ''
      paths:
        {{- if .IsMepService }}
        - /{{.SandboxName}}/{{.LocationName}}/meep-cloud-mosquitto
        {{- else }}
        - /{{.SandboxName}}/meep-cloud-mosquitto
        {{- end }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ .HttpsOnly }}
    {{- if .IsMepService }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/{{.SandboxName}}/{{.LocationName}}/meep-cloud-mosquitto(/|$)(.*)$ /$2 break;
    {{- else }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/{{.SandboxName}}/meep-cloud-mosquitto(/|$)(.*)$ /$2 break;
    {{- end }}
    {{- if .AuthEnabled }}
    nginx.ingress.kubernetes.io/auth-url: {{ if .HttpsOnly }}https{{ else }}http{{ end }}://$http_host/auth/v1/authenticate?svc=meep-cloud-mosquitto&sbox={{.SandboxName}}&mep={{.LocationName}}
    {{- end }}
  labels: {}
  tls:

prometheus:
  monitor:
    enabled: true
    port: 9000
    interval: 10s
    additionalLabels: {}
    relabelings: []
    scrapeTimeout: 5s
    
codecov:
  enabled: false
  location: "<WORKDIR>/codecov/meep-cloud-mosquitto"

meepOrigin: core
