  /notifications/mec011/appTermination:
    post:
      tags:
      - location
      summary: MEC011 Application Termination notification for self termination
      description: Terminates itself.
      operationId: mec011AppTerminationPOST
      requestBody:
        description: Termination notification details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppTerminationNotification'
            example:
              notificationType: AppTerminationNotification
              operationAction: TERMINATING
              maxGracefulTimeout: 10
              links:
                subscription:
                  href: http://mec011Server.example.com/mec_app_support/v1/applications/appId1234/subscriptions/sub123
                confirmTermination:
                  href: http://mec011Server.example.com/mec_app_support/v1/confirm_termination
        required: true
      responses:
        "204":
          description: No Content
      x-swagger-router-controller: notifications
  /subscriptions:
    get:
      tags:
        - unsupported
      summary: Get Subscription Links
      description: The GET method is used to request information about the subscriptions for this requestor.
      parameters:
        - name: subscription_type
          in: query
          required: false
          schema:
            type: string
            enum: 
              - bw_chg
          description: "Query parameter to filter on a specific subscription type. Permitted values: bw_chg."
          x-etsi-mec-cardinality: 0..1
          x-etsi-mec-origin-type: String
      responses:
        '200':
          description: Successful response with the list of links to requestor's subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionLinkList'
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: It is used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden :  operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found :  used when a client provided a URI that cannot\
            \ be mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "406":
          description: "Not Acceptable :  It is used to indicate the server cannot provide any\
            \ of the content formats supported by the clients"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "429":
          description: "Too many requests: It is used when a rate limiter has triggered."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
        - unsupported
      summary: Create a new subscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BwChgEventSubscription'
      responses:
        '201':
          description: "Created: Indicates successful resource creation, where the resource URI shall be\
            \ returned in the HTTP Location header field."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BwChgEventSubscription'
        '400':
          description: "Bad Request: Incorrect parameters were passed to the request."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: "Unauthorized: The client did not submit credentials."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: "Forbidden: The operation is not allowed given the current status of the resource."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: "Not Found: The client provided a URI that cannot be mapped to a valid resource URI."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: "Not Acceptable: The server cannot provide any of the content formats supported by the client."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: "Unsupported Media Type: The server or the client does not support the content type of the entity body."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: "Unprocessable Entity: The server understands the content type of the request entity and\
            \ the syntax of the request entity is correct but the server is unable to process the contained instructions."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: "Too Many Requests: A rate limiter has triggered."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      callbacks:
        BwChgEventNotification:
          '{$request.body#/callbackReference}':
            post:
              tags:
              - callbacks
              summary: Create callback
              description: The POST method delivers a notification from the BWM service to the subscriber
              operationId: BwChgEventNotification_POST
              requestBody:
                $ref: '#/components/requestBodies/BwChgEventNotification'
              responses:
                "204":
                  description: The notification was delivered successfully. 
                '401':
                  description: "Unauthorized: The client did not submit credentials."
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/ProblemDetails'
                "403":
                  description: "Forbidden :  operation is not allowed given the current status\
                    \ of the resource."
                  content:
                    application/problem+json:
                      schema:
                        $ref: '#/components/schemas/ProblemDetails'
                "404":
                  description: "Not Found :  used when a client provided a URI that cannot\
                    \ be mapped to a valid resource URI."
                  content:
