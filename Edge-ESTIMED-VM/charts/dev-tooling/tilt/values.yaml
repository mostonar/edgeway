replicaCount: 1

image:
  repository: meep-docker-registry:30001/meep-tilt
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 10350

ingress:
  enabled: true
  hosts:
    - name: ''
      paths:
        - /tilt
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2

gitdir: <GITDIR>
workdir: <WORKDIR>
homedir: <HOMEDIR>
hostNetwork: true
permissions:
  uid: ''
  gid: ''

