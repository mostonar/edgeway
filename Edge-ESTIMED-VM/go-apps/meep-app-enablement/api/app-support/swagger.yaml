  /applications/{appInstanceId}/subscriptions:
    get:
      tags:
        - mec_app_support
      summary: Retrieve information about a list of mecAppSupportSubscription resources for this subscriber
      description: >-
        The GET method may be used to request information about all subscriptions for this requestor. Upon success, the response contains message content with all the subscriptions for the requestor.
      operationId: ApplicationsSubscriptions_GET
      parameters:
        - name: appInstanceId
          in: path
          description: >-
            Represents a MEC application instance. Note that the appInstanceId is allocated by the MEC platform manager.
          required: true
          style: simple
          schema:
            type: string
      responses:
        '200':
          description: >-
            Upon success, a response message content containing the list of links to the requested subscriptions is returned.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MecAppSuptApiSubscriptionLinkList'
        '400':
          description: >-
            Bad Request. It is used to indicate that incorrect parameters were passed to the request.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
        '403':
          description: >-
            Forbidden. The operation is not allowed given the current status of the resource.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            Not Found. It is used when a client provided a URI that cannot be mapped  to a valid resource URI.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
      deprecated: false
    post:
      tags:
        - mec_app_support
      summary: Create a mecAppSupportSubscription resource
      description: >-
        The POST method may be used to create a new subscription. One example use case is to create a new subscription to the MEC service availability notifications. Upon success, the response contains message content describing the created subscription.
      operationId: ApplicationsSubscriptions_POST
      parameters:
        - name: appInstanceId
          in: path
          description: >-
            Represents a MEC application instance. Note that the appInstanceId is allocated by the MEC platform manager.
          required: true
          style: simple
          schema:
            type: string
      requestBody:
        description: >-
          Message content in the request contains a subscription to the MEC application termination notifications that is to be created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppTerminationNotificationSubscription'
        required: true
      responses:
        '201':
          description: >-
            Entity body in the request contains a subscription to the  MEC service availability notifications that is to be created.
          headers:
            location:
              description: The resource URI of the created resource
              content:
                text/plain:
                  schema:
                    type: string
                    description: The resource URI of the created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppTerminationNotificationSubscription'
        '400':
          description: >-
            Bad Request. It is used to indicate that incorrect parameters were passed to the request.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
        '403':
          description: >-
            Forbidden. The operation is not allowed given the current status of the resource.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            Not Found. It is used when a client provided a URI that cannot be mapped  to a valid resource URI.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
      deprecated: false
      callbacks:
        AppTerminationNotification:
          '{$request.body#/callbackUri}':
            post:
              description: >-
                Represents the information that the MEP notifies the subscribed application instance about the corresponding application instance termination/stop'
              operationId: AppTerminationNotification_POST
              tags:
                - callbacks
              summary: Create callback
              requestBody:
                $ref: '#/components/requestBodies/AppTerminationNotification'
              responses:
                '200':
                  description: >-
                    Expected responses from callback consumer, if it accepts the callback
    parameters: []
  /applications/{appInstanceId}/subscriptions/{subscriptionId}:
    get:
      tags:
        - mec_app_support
      summary: Retrieve information about a mecAppSupportSubscription resource for this subscriber
      description: >-
        The GET method requests information about a subscription for this requestor. Upon success, the response contains message content with the subscription for the requestor.
      operationId: ApplicationsSubscription_GET
      parameters:
        - name: appInstanceId
          in: path
          description: >-
            Represents a MEC application instance. Note that the appInstanceId is allocated by the MEC platform manager.
          required: true
          style: simple
