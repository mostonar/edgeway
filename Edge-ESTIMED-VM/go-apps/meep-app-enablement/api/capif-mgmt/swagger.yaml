      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAPIDescriptionPatch'
        required: true
      responses:
        "200":
          description: "Successful case. The \"Individual APF published API\"\n resource\
            \ is successfully modified and a representation of \n the updated resource\
            \ shall be returned in the response \n body.\n"
          content:
            application/json:
              schema:
