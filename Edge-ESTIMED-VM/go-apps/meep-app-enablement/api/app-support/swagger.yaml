    EesAuthMethod:
      anyOf:
      - type: string
        enum:
          - TLS_CLIENT_SERVER_CERTIFICATE
          - TLS_WITH_AKMA
          - TLS_WITH_GBA
          - SERVER_SIDE_CERTIFICATE_BASED
      - type: string
        description: >
          This string provides forward-compatibility with future
          extensions to the enumeration and is not used to encode
          content defined in the present version of this API.
      description: |
        Represents the Authentication methods supported by EES.  
        Possible values are:
        - TLS_CLIENT_SERVER_CERTIFICATE: Represents TLS with client server certificate
          authentication.
        - TLS_WITH_AKMA: Represents TLS with AKMA authentication.
        - TLS_WITH_GBA: Represents TLS with GBA authentication.
        - SERVER_SIDE_CERTIFICATE_BASED: Represents server side certification only.

    AppReadyConfirmation:
      title: AppReadyConfirmation
      required:
        - indication
      type: object
      properties:
        indication:
          type: string
          description: Indication about the MEC application instance.
          example:
             READY
      description: >-
        This type represents the information that the MEC application instance indicates to the MEC platform that it is up and running.
    AppInfo:
      title: AppInfo
      required:
        - appName
      type: object
      properties:
        appName:
          title: appName
          type: string
          description: >-
            Name of the application. It shall be consistent with the appName in the AppD, if an AppD is available.
          example:
             appName
        appProvider:
          title: appProvider
          type: string
          description: >-
            Provider of the application. It shall be consistent with the appProvider in the AppD, if an AppD is available. See note 1.
          example:
             appProvider1
        appCategory:
          $ref: '#/components/schemas/CategoryRef'
        appDId:
          title: appDId
          type: string
          description: >-
            The application descriptor identifier. It is managed by the application provider to identify the application descriptor in a globally unique way. Shall be present if the application instance is instantiated by the MEC Management.
          example:
             TODO
        appInstanceId:
          title: appInstanceId
          type: string
          description: >-
            Identifier of the application instance. Shall be present if the application instance is instantiated by the MEC Management.
          example:
             ID1
        endpoint:
          oneOf:
            - $ref: '#/components/schemas/EndPointInfoUris'
            - $ref: '#/components/schemas/EndPointInfoFqdn'
            - $ref: '#/components/schemas/EndPointInfoAddresses'
            - $ref: '#/components/schemas/EndPointInfoAlternative'
          description: This type represents information about a transport endpoint
          x-etsi-notes: "NOTE 1:\tIf appProfile is present, appProvider shall be consistent with provId provided in EAS profile data type, i.e. the same.\nNOTE 2:\tIf appProfile is present, endpoint shall refer to the same end point as endPt provided in EAS profile data type."
        appServiceRequired:
          title: appServiceRequired
          type: array
          items:
            $ref: '#/components/schemas/ServiceDependency'
          description: >-
            Describes services a MEC application requires to run. ServiceDependency is defined in ETSI GS MEC 010-2 [4]. It shall not be provided if an AppD is available.
        appServiceOptional:
          title: appServiceOptional
          type: array
          items:
            $ref: '#/components/schemas/ServiceDependency'
          description: >-
            Describes services a MEC application may use if available. ServiceDependency is defined in ETSI GS MEC 010-2 [4]. It shall not be provided if an AppD is available.
        appFeatureRequired:
          title: appFeatureRequired
          type: array
          items:
            $ref: '#/components/schemas/FeatureDependency'
          description: >-
            Describes features a MEC application requires to run. FeatureDependency is defined in ETSI GS MEC 010-2 [4]. It shall not be provided if an AppD is available.
        appFeatureOptional:
          title: appFeatureOptional
          type: array
          items:
            $ref: '#/components/schemas/FeatureDependency'
          description: >-
            Describes features a MEC application may use if available. FeatureDependency is defined in ETSI GS MEC 010-2 [4]. It shall not be provided if an AppD is available.
        isInsByMec:
          type: boolean
          description: >-
            Indicate whether the application instance is instantiated by the MEC Management. Default to FALSE if absent.
          example:
             false
        appProfile:
          $ref: '#/components/schemas/AppProfile'
      description: >-
        This type represents the information provided by the MEC application instance as part of the "application registration request" and "application registration update" messages.
      x-etsi-notes: "NOTE 1:\tIf appProfile is present, appProvider shall be consistent with provId provided in EAS profile data type, i.e. the same.\nNOTE 2:\tIf appProfile is present, endpoint shall refer to the same end point as endPt provided in EAS profile data type."
    AppTerminationConfirmation:
      title: AppTerminationConfirmation
      required:
        - operationAction
      type: object
      properties:
        operationAction:
          $ref: '#/components/schemas/OperationActionType'
      description: >-
        This type represents the information that the MEC application instance provides to the MEC platform when informing it that the application has completed its application level related terminate/stop actions, e.g. retention of application state in the case of stop.
    AppTerminationNotificationLinks:
      title: AppTerminationNotificationLinks
      required:
        - subscription
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/LinkType'
        confirmTermination:
          $ref: '#/components/schemas/LinkTypeConfirmTermination'
      description: Object containing hyperlinks related to the resource.
    AppTerminationNotification:
      title: AppTerminationNotification
      required:
        - notificationType
        - operationAction
        - maxGracefulTimeout
        - _links
      type: object
      properties:
        notificationType:
          type: string
          description: Shall be set to AppTerminationNotification.
          example:
            - AppTerminationNotification
        operationAction:
          $ref: '#/components/schemas/OperationActionType'
        maxGracefulTimeout:
          type: integer
          description: >-
            Maximum timeout value in seconds for graceful termination or graceful stop of an application instance.
          example:
            - 10
        _links:
          $ref: '#/components/schemas/AppTerminationNotificationLinks'
      description: >-
        This type represents the information that the MEC platform notifies the subscribed application instance about  the corresponding application instance termination/stop.
    AppTerminationNotificationSubscription:
      title: AppTerminationNotificationSubscription
      required:
        - subscriptionType
        - callbackReference
        - _links
        - appInstanceId
      type: object
      properties:
        subscriptionType:
          type: string
          description: Shall be set to AppTerminationNotificationSubscription.
          example:
             AppTerminationNotificationSubscription
        callbackReference:
          type: string
          description: >-
            URI selected by the MEC application instance to receive notifications on the subscribed MEC application instance management information. This shall be included in both the request and the response.
        _links:
          $ref: '#/components/schemas/Self'
        appInstanceId:
          type: string
          description: It is used as the filtering criterion for the subscribed events.
          example:
             ID1
      description: >-
        This type represents the information that the MEC platform notifies the subscribed application instance about  the corresponding application instance termination/stop.
    CurrentTime:
      title: CurrentTime
      required:
        - seconds
        - nanoSeconds
        - timeSourceStatus
      type: object
      properties:
        seconds:
          type: integer
          description: >-
            The seconds part of the time. Time is defined as Unix-time since January 1, 1970, 00:00:00 UTC
          example:
            - 1577836800
        nanoSeconds:
          type: integer
          description: >-
            The nanoseconds part of the time. Time is defined as Unix-time since January 1, 1970, 00:00:00 UTC
          example:
            - 0
        timeSourceStatus:
          $ref: '#/components/schemas/TimeSourceStatus'
      description: >-
        This type represents the information provided by the MEC platform in response to the Get Platform Time Request message.
    DestinationInterfaceInterfaceType:
      title: DestinationInterfaceInterfaceType
      enum:
        - TUNNEL
        - MAC
        - IP
      type: string
      description: Type of the interface
      example:
        - TUNNEL
    DestinationInterface:
      title: DestinationInterface
      required:
        - interfaceType
      type: object
      properties:
        interfaceType:
          $ref: '#/components/schemas/DestinationInterfaceInterfaceType'
        tunnelInfo:
          $ref: '#/components/schemas/TunnelInfo'
        srcMacAddress:
          type: string
          description: Source address identifies the MAC address of the interface
          example:
            - 02-00-00-00-00-00
        dstMacAddress:
          type: string
          description: Source address identifies the MAC address of the interface
          example:
            - 02-00-00-00-00-00
        dstIpAddress:
          type: string
          description: IP address of the remote destination
          example:
            - 192.0.2.0
      description: >-
        This type represents the destination interface. If the action is FORWARD_DECAPSULATED, FORWARD_ENCAPSULATED or PASSTHROUGH one value shall be provided. If the action is DUPLICATE_DECAPSULATED or DUPLICATE_ENCAPSULATED, two values shall be provided. If the action is DROP, no value shall be provided.
    DnsRuleIpAddressType:
      title: DnsRuleIpAddressType
      enum:
        - IP_V6
        - IP_V4
      type: string
      description: IP address type
      example:
        - IP_V6
    DnsRuleState:
      title: DnsRuleState
      enum:
        - ACTIVE
        - INACTIVE
      type: string
      description: DNS rule state. This attribute may be updated using HTTP PUT method
      example:
        - ACTIVE
    DnsRule:
      title: DnsRule
      required:
        - dnsRuleId
        - domainName
        - ipAddressType
        - ipAddress
        - state
      type: object
      properties:
        dnsRuleId:
          type: string
          description: Identifies the DNS Rule
          example:
            - dnsRule1
        domainName:
          type: string
          description: FQDN resolved by the DNS rule
          example:
            - www.example.com
        ipAddressType:
          $ref: '#/components/schemas/DnsRuleIpAddressType'
        ipAddress:
          type: string
          description: IP address associated with the FQDN resolved by the DNS rule
          example:
            - 192.0.2.0
        ttl:
          type: integer
          description: Time to live value
        state:
          $ref: '#/components/schemas/DnsRuleState'
      description: This type represents the general information of a DNS rule.
      x-etsi-notes: "NOTE:\tIf no ttl value is provided, the DnsRule shall not expire."
    LinkType:
      title: LinkType
      type: object
      properties:
        href:
          type: string
          description: URI referring to a resource
          example:
             /mecAppSuptApi/example
      description: >-
        This type represents a type of link and may be referenced from data
        structures
    LinkTypeConfirmTermination:
      title: LinkTypeConfirmTermination
      type: object
      properties:
        href:
          type: string
          description: URI referring to a resource
          example:
            - /mecAppSuptApi/example
      description: >-
        Link to the task resource where to confirm termination in case the  application is ready to be terminated before expiry of the timeout.
    MecAppSuptApiSubscriptionLinkListLinks:
      title: MecAppSuptApiSubscriptionLinkListLinks
      required:
        - self
      type: object
      properties:
        self:
          $ref: '#/components/schemas/LinkType'
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/MecAppSuptApiSubscriptionLinkListSubscription'
          description: The MEC application instance's subscriptions
      description: Object containing hyperlinks related to the resource.
    MecAppSuptApiSubscriptionLinkListSubscription:
      title: MecAppSuptApiSubscriptionLinkListSubscription
      required:
        - href
        - subscriptionType
      type: object
      properties:
        href:
          type: string
          description: URI referring to a resource
          example:
            - /mecAppSuptApi/example
        subscriptionType:
          type: string
          description: Type of the subscription. The values are as defined in the "subscriptionType" attribute for each different Mp1 event subscription data type.
      description: A link to a subscription.
    MecAppSuptApiSubscriptionLinkList:
      title: MecAppSuptApiSubscriptionLinkList
      required:
        - _links
      type: object
      properties:
        _links:
          $ref: '#/components/schemas/MecAppSuptApiSubscriptionLinkListLinks'
      description: >-
        This type represents a list of links related to currently existing subscriptions for a MEC application instance. This information is returned when sending a request to receive current subscriptions.
    OperationActionType:
      title: OperationActionType
      enum:
        - STOPPING
        - TERMINATING
      type: string
      description: Operation that is being performed on the MEC application instance.
      example:
        - TERMINATING
    ProblemDetails:
      title: ProblemDetails
      type: object
      properties:
        type:
          type: string
          description: >-
            A URI reference according to IETF RFC 3986 that identifies the problem type
        title:
          type: string
          description: 'A short, human-readable summary of the problem type'
        status:
          type: integer
          description: The HTTP status code for this occurrence of the problem
        detail:
          type: string
          description: >-
            A human-readable explanation specific to this occurrence of the problem
        instance:
          type: string
          description: >-
            A URI reference that identifies the specific occurrence of the problem
    Self:
      title: Self
      required:
        - self
      type: object
      properties:
        self:
          $ref: '#/components/schemas/LinkType'
      description: Self-referring URI.
    TimingCapsNtpServersAuthenticationOption:
      title: TimingCapsNtpServersAuthenticationOption
      enum:
        - NONE
        - SYMMETRIC_KEY
        - AUTO_KEY
      type: string
      description: NTP authentication option
      example:
        - NONE
    TimingCapsNtpServersNtpServerAddrType:
      title: TimingCapsNtpServersNtpServerAddrType
      enum:
        - IP_ADDRESS
        - DNS_NAME
      type: string
      description: Address type of NTP server
      example:
        - IP_ADDRESS
    TimingCapsNtpServers:
      title: TimingCapsNtpServers
      required:
        - ntpServerAddrType
        - ntpServerAddr
        - minPollingInterval
        - maxPollingInterval
        - localPriority
        - authenticationOption
      type: object
      properties:
        ntpServerAddrType:
          $ref: '#/components/schemas/TimingCapsNtpServersNtpServerAddrType'
        ntpServerAddr:
          type: string
          description: NTP server address
          example:
            - 192.0.2.0
        minPollingInterval:
          type: integer
          description: >-
            Minimum poll interval for NTP messages, in seconds as a power of two. Range 3 to 17
          example:
            - 3
        maxPollingInterval:
          type: integer
          description: >-
            Maximum poll interval for NTP messages, in seconds as a power of two. Range 3 to 17
          example:
            - 17
        localPriority:
          type: integer
          description: NTP server local priority
          example:
            - 1
        authenticationOption:
          $ref: '#/components/schemas/TimingCapsNtpServersAuthenticationOption'
        authenticationKeyNum:
          type: integer
          description: >-
            Authentication key number. This configuration is valid and shall be present if authenticationOption is set to SYMMETRIC_KEY
          example:
            - 1
      description: NTP server detail.
    TimingCaps_PtpMasters:
      title: TimingCaps_PtpMasters
      required:
        - ptpMasterIpAddress
        - ptpMasterLocalPriority
        - delayReqMaxRate
      type: object
      properties:
        ptpMasterIpAddress:
          type: string
          description: PTP Server (referred to as "master" in IEEE 1588-2019) IP Address
          example:
            - 192.0.2.0
        ptpMasterLocalPriority:
          type: integer
          description: >-
            PTP Server (referred to as "master" in IEEE 1588-2019 ) local priority
          example:
            - 1
        delayReqMaxRate:
          type: integer
          description: >-
            Acceptable maximum rate of the Delay_Req messages in packets per second
          example:
            - 10
      description: NTP server detail.
    TimingCapsTimeStamp:
      title: TimingCapsTimeStamp
      required:
        - seconds
        - nanoSeconds
      type: object
      properties:
        seconds:
          type: integer
          description: >-
            The seconds part of the time. Time is defined as Unix-time since January 1, 1970, 00:00:00 UTC
          example:
            - 1577836800
        nanoSeconds:
          type: integer
          description: >-
            The nanoseconds part of the time. Time is defined as Unix-time since January 1, 1970, 00:00:00 UTC
          example:
            - 0
      description: time
    TimingCaps:
      title: TimingCaps
      type: object
      properties:
        timeStamp:
          $ref: '#/components/schemas/TimingCapsTimeStamp'
        ntpServers:
          type: array
          items:
            $ref: '#/components/schemas/TimingCapsNtpServers'
          description: Available NTP servers
        ptpMasters:
          type: array
          items:
            $ref: '#/components/schemas/TimingCaps_PtpMasters'
          description: >-
            Number of available PTP Servers (referred to as "masters" in IEEE 1588-2019)
      description: >-
        This type represents the information provided by the MEC platform in response to the Timing capabilities Query message.
    TrafficFilter:
      title: TrafficFilter
      type: object
      properties:
        srcAddress:
          type: array
          items:
            type: string
          description: >-
            An IP address or a range of IP address. For IPv4, the IP address could be an IP address plus mask, or an individual IP address, or a range of IP addresses. For IPv6, the IP address could be an IP prefix, or a range of IP prefixes.
        dstAddress:
          type: array
          items:
            type: string
          description: >-
            An IP address or a range of IP address. For IPv4, the IP address could be an IP address plus mask, or an individual IP address, or a range of IP addresses. For IPv6, the IP address could be an IP prefix, or a range of IP prefixes.
        srcPort:
          type: array
          items:
            type: string
          description: A port or a range of ports
        dstPort:
          type: array
          items:
            type: string
          description: A port or a range of ports
        protocol:
          type: array
          items:
            type: string
          description: Specify the protocol of the traffic filter
        tag:
          type: array
          items:
            type: string
          description: Used for tag based traffic rule
        srcTunnelAddress:
          type: array
          items:
            type: string
          description: Used for GTP tunnel based traffic rule
        tgtTunnelAddress:
          type: array
          items:
            type: string
          description: Used for GTP tunnel based traffic rule
        srcTunnelPort:
          type: array
          items:
            type: string
          description: Used for GTP tunnel based traffic rule
        dstTunnelPort:
          type: array
          items:
            type: string
          description: Used for GTP tunnel based traffic rule
        qCI:
          type: integer
          description: >-
            Used to match all packets that have the same Quality Class Indicator (QCI).
          example:
            - 1
        dSCP:
          type: integer
          description: >-
            Used to match all IPv4 packets that have the same Differentiated Services Code Point (DSCP)
          example:
            - 0
        tC:
          type: integer
          description: Used to match all IPv6 packets that have the same Traffic Class.
          example:
            - 1
      description: This type represents the traffic filter.
    TrafficRuleAction:
      title: TrafficRuleAction
      enum:
        - DROP
        - FORWARD_DECAPSULATED
        - FORWARD_ENCAPSULATED
        - PASSTHROUGH
        - DUPLICATE_DECAPSULATED
        - DUPLICATE_ENCAPSULATED
      type: string
      description: >-
        The action of the MEC host data plane when a packet matches the trafficFilter
      example:
        - DROP
    TrafficRuleFilterType:
      title: TrafficRuleFilterType
      enum:
        - FLOW
        - PACKET
      type: string
      description: >-
        Definition of filter per FLOW or PACKET. If flow the filter match UE->EPC packet and the reverse packet is handled in the same context
      example:
        - FLOW
    TrafficRuleState:
      title: TrafficRuleState
      enum:
        - ACTIVE
        - INACTIVE
      type: string
      description: >-
        Contains the traffic rule state. This attribute may be updated using HTTP PUT method
      example:
        - ACTIVE
    TrafficRule:
      title: TrafficRule
      required:
        - trafficRuleId
        - filterType
        - priority
        - trafficFilter
        - action
        - state
      type: object
      properties:
        trafficRuleId:
          type: string
          description: Identify the traffic rule.
          example:
            - TrafficRule1
        filterType:
          $ref: '#/components/schemas/TrafficRuleFilterType'
        priority:
          type: integer
          description: >-
            Priority of this traffic rule within the range 0 to 255. If traffic rules conflict, the one with higher priority take precedence. Value indicates the priority in descending order, i.e. with 0 as the highest priority and 255 as the lowest priority.
          example:
            - 1
        trafficFilter:
          type: array
          items:
            $ref: '#/components/schemas/TrafficFilter'
          description: ''
        action:
          $ref: '#/components/schemas/TrafficRuleAction'
        dstInterface:
          type: array
          items:
            $ref: '#/components/schemas/DestinationInterface'
          maxItems: 2
        state:
          $ref: '#/components/schemas/TrafficRuleState'
      description: This type represents the general information of a traffic rule.
      x-etsi-notes: "NOTE 1:\tValue indicates the priority in descending order, i.e. with 0 as the highest priority and 255 as the lowest priority.\nNOTE 2:\tSome applications (like inline/tap) require two interfaces. The first interface in the case of inline/tap is on the client (e.g. UE) side and the second on the core network (e.g. EPC) side."
    TunnelInfoTunnelType:
      title: TunnelInfoTunnelType
      enum:
        - GTP_U
        - GRE
      type: string
      description: This type represents the tunnel information.
      example:
        - GTP_U
    TunnelInfo:
      title: TunnelInfo
      required:
        - tunnelType
      type: object
      properties:
        tunnelType:
          $ref: '#/components/schemas/TunnelInfoTunnelType'
        tunnelDstAddress:
          type: string
          description: Destination address of the tunnel
          example:
            - '192.127.4.100/32'
        tunnelSrcAddress:
          type: string
          description: Source address of the tunnel
          example:
            - '192.127.4.101/32'
      description: This type represents the tunnel information.
    TimeSourceStatus:
      title: TimeSourceStatus
      enum:
        - TRACEABLE
        - NONTRACEABLE
      type: string
      description: >-
        Platform Time Source status. 1 = TRACEABLE - time source is locked to the UTC time source. 2 = NONTRACEABLE - time source is not locked to the UTC time source
      example:
        - TRACEABLE
    CategoryRef:
      title: CategoryRef
      required:
        - href
        - id
        - name
        - version
      type: object
      properties:
        href:
          type: string
          description: Reference of the catalogue
          example:
             /example/catalogue1
        id:
          type: string
          description: Unique identifier of the category
          example:
             id12345
        name:
          type: string
          description: >-
            Name of the category, example values include RNI, Location & Bandwidth Management
          example:
             RNI
        version:
          type: string
          description: Category version
          example:
             version1
      description: This type represents the category reference
    EndPointInfoAddress:
      title: EndPointInfoAddress
      required:
        - host
        - port
      type: object
      properties:
        host:
          type: string
          description: Host portion of the address
          example:
            - 192.0.2.0
        port:
          type: integer
          description: Port portion of the address
          example:
            - 8080
      description: A IP address and port pair
    EndPointInfoAddresses:
      title: EndPointInfoAddresses
      required:
        - addresses
      type: object
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/EndPointInfoAddress'
          description: >-
            Entry point information of the service as one or more pairs of IP address and port. See note.
      description: This type represents information about a transport endpoint.
    EndPointInfoAlternative:
      title: EndPointInfoAlternative
      required:
        - alternative
      type: object
      properties:
        alternative:
          type: object
          description: >-
            Entry point information of the service in a format defined by an implementation, or in an external specification. See note.
      description: This type represents information about a transport endpoint.
    EndPointInfoUris:
      title: EndPointInfoUris
      required:
        - uris
      type: object
      properties:
        uris:
          type: array
          items:
            type: string
          description: >-
            Entry point information of the service as string, formatted according to URI syntax
      description: This type represents information about a transport endpoint.
    EndPointInfoFqdn:
      title: EndPointInfoFqdn
      required:
        - fqdn
      type: object
      properties:
        fqdn:
          type: array
          items:
            type: string
          description: Fully Qualified Domain Name of the service. See note.
      description: 'This type represents information about a transport endpoint. '
    ServiceDependency:
      properties:
        requestedPermissions:
          description: >-
            Requested permissions regarding the access of the application to the service. See clause 8.2 of ETSI GS MEC 009 [4]. The format of this attribute is left for the data model design stage.
          minItems: 0
          type: string
        serCategory:
          $ref: '#/components/schemas/CategoryRef'
        serName:
          description: 'The name of the service, for example, RNIS, LocationService, etc.'
          type: string
        serTransportDependencies:
          description: >-
            Indicates transport and serialization format dependencies of consuming the service. Defaults to REST + JSON if absent. See note.
          items:
            $ref: '#/components/schemas/TransportDependency'
          minItems: 0
          type: array
        version:
          description: The version of the service.
          type: string
      required:
        - serName
        - version
      type: object
      x-etsi-notes: "NOTE:\tThis attribute indicates groups of transport bindings that a service-consuming MEC application supports for the consumption of the MEC service defined by this ServiceDependency structure. If at least one of the indicated groups is supported by the service it may be consumed by the application."
    TransportDependency:
      properties:
        labels:
          description: >-
            Set of labels that allow to define groups of transport bindings. The mechanism of the grouping is defined below this table.
          items:
            type: string
          minItems: 1
          type: array
        serializers:
          description: >-
            Information about the serializers in this transport binding, as defined in the SerializerType type in ETSI GS MEC 011 [i.4]. Support for at least one of the entries is required in conjunction with the transport.
          items:
            $ref: '#/components/schemas/SerializerType'
          minItems: 1
          type: array
        transport:
          $ref: '#/components/schemas/TransportDescriptor'
      required:
        - transport
        - serializers
        - labels
      type: object
    TransportDescriptor:
      properties:
        protocol:
          description: >-
            The name of the protocol used. Shall be set to "HTTP" for a REST API.
          type: string
        security:
          $ref: '#/components/schemas/SecurityInfo'
        type:
          $ref: '#/components/schemas/TransportType'
        version:
          description: The version of the protocol used.
          type: string
      required:
        - type
        - protocol
        - version
        - security
      type: object
    SerializerType:
      title: SerializerType
      enum:
        - JSON
        - XML
        - PROTOBUF3
      type: string
      description: The enumeration represents types of serializers
      example:
         JSON
    SecurityInfo:
      title: SecurityInfo
      type: object
      properties:
        oAuth2Info:
          $ref: '#/components/schemas/SecurityInfoOAuth2Info'
      description: This type represents security information related to a transport
    SecurityInfoOAuth2Info:
      title: SecurityInfoOAuth2Info
      required:
        - grantTypes
        - tokenEndpoint
      type: object
      properties:
        grantTypes:
          maxItems: 4
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/SecurityInfoOAuth2InfoGrantType'
          description: List of supported OAuth 2.0 grant types.
        tokenEndpoint:
          type: string
          description: The token endpoint
          example:
             /mecSerMgmtApi/security/TokenEndPoint
      description: Parameters related to use of OAuth 2.0
    SecurityInfoOAuth2InfoGrantType:
      title: SecurityInfoOAuth2InfoGrantType
      enum:
        - OAUTH2_AUTHORIZATION_CODE
        - OAUTH2_IMPLICIT_GRANT
        - OAUTH2_RESOURCE_OWNER
        - OAUTH2_CLIENT_CREDENTIALS
      type: string
      description: OAuth 2.0 grant type
      example:
         OAUTH2_CLIENT_CREDENTIALS
    TransportType:
      title: TransportType
      enum:
        - REST_HTTP
        - MB_TOPIC_BASED
        - MB_ROUTING
        - MB_PUBSUB
        - RPC
        - RPC_STREAMING
        - WEBSOCKET
      type: string
      description: The enumeration TransportType represents types of transports
      example:
         REST_HTTP
    FeatureDependency:
      properties:
        featureName:
          description: 'The name of the feature, for example, UserApps, UEIdentity, etc.'
          type: string
        version:
          description: The version of the feature.
          type: string
      required:
        - featureName
        - version
      type: object
    AppProfile:
      type: object
      required:
        - easId
        - endPt
        - acIds
        - scheds
        - permLvl
        - easFeats
        - svcContSupp
        - appLocs
      properties:
        easId:
          description: The identifier of the EAS
          type: string
          example:
             appName
        endPt:
          description: The version of the feature.
          oneOf:
            - $ref: '#/components/schemas/EndPointInfoUris'
            - $ref: '#/components/schemas/EndPointInfoFqdn'
            - $ref: '#/components/schemas/EndPointInfoAddresses'
            - $ref: '#/components/schemas/EndPointInfoAlternative'
        acIds:
          type: array
          items:
            type: string
          minItems: 1
          description: Identities of the Application Clients that can be served by the EAS
        provId:
          type: string
          description: Identifier of the ASP that provides the EAS.
          example:
             appProvider1
        type:
          description: The category or type of EAS.
          type: string
        scheds:
          type: array
          items:
            type: string
          minItems: 1
          description: The availability schedule of the EAS.
        svcArea:
          type: string
          description: >-
            The list of geographical and topological areas that the EAS serves. ACs in the UE that are outside the area will not be served.
        svcKpi:
          type: string
          description: Service characteristics provided by the EAS.
        permLvl:
          type: array
          items:
            type: string
          minItems: 1
          description: level of service permissions supported by the EAS.
        easFeats:
          type: array
          items:
            type: string
          minItems: 1
          description: Service features supported by the EAS.
        svcContSupp:
          type: array
          items:
            type: string
          minItems: 1
          description: The ACR scenarios supported by the EAS for service continuity.
        appLocs:
          type: array
          items:
            type: string
          minItems: 1
          description: >-
            List of DNAI(s) and the N6 traffic information associated with the EAS.
        avlRep:
          type: integer
          description: >-
            The period indicating to the EES, how often the EES needs to check the EAS's availability after a successful registration.
          example:
             1577836800
        status:
          type: string
          description: 'EAS status information. '
  requestBodies:
    AppTerminationNotification:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AppTerminationNotification'
      required: true