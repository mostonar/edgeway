apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}
  labels:
    app: {{ template "meep-acme-mn-cse.name" . }}
    chart: {{ template "meep-acme-mn-cse.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    meepOrigin: {{ .Values.meepOrigin }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ template "meep-acme-mn-cse.name" . }}
    release: {{ .Release.Name }}
  ports:
    - name: meep-acme-mn-cse
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.deployment.port }}
      {{- if .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if eq (toString .Values.image.env.ENABLE_WS | lower) "true" }}
    - name: websocket
      port: 8180
      targetPort: websocket
      protocol: TCP
    {{- end }}
    {{- if .Values.prometheus.monitor.enabled}}
    - name: metrics
      port: {{ .Values.prometheus.monitor.port }}
      targetPort: {{ .Values.prometheus.monitor.port }}
      protocol: TCP
    {{- end}}

