{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/tilt$ $scheme://$http_host/tilt/ permanent;
      proxy_set_header Accept-Encoding "";
      sub_filter_once off;
      sub_filter_types text/html text/javascript application/javascript;
      sub_filter 'src="/' 'src="/tilt/';
      sub_filter 'href="/' 'href="/tilt/';
      sub_filter '"/ws/view"' '"/tilt/ws/view"';
      sub_filter '"/api/' '"/tilt/api/';
      sub_filter '"api/' '"tilt/api/';
spec:
  rules:
    {{- range .Values.ingress.hosts }}
    - http:
        paths:
          {{- range $path := .paths }}
          - path: "{{ $path }}(/|$)(.*)"
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $.Release.Name }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
      {{- if .name }}
      host: {{ .name }}
      {{- end }}
    {{- end }}
{{- end }}
