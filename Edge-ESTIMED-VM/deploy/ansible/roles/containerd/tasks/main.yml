---
- name: Ensure Docker repo exists for containerd
  import_role:
    name: docker
    tasks_from: repo.yml

- name: Install containerd
  apt:
    name: "containerd.io={{ containerd_version }}"
    state: present
    allow_downgrade: true
    update_cache: true
    cache_valid_time: 3600   # Only updates cache if older than 1 hour
  become: true
  retries: 2        # try up to 3 times
  delay: 5         # wait 10 between retries

- name: Generate default containerd config
  shell: containerd config default > {{ containerd_config_path }}
  args:
    executable: /bin/bash
  become: true
  changed_when: true

- name: Ensure SystemdCgroup is true
  replace:
    path: "{{ containerd_config_path }}"
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  become: true
  notify: Restart containerd

- name: Replace containerd sandbox image
  replace:
    path: "{{ containerd_config_path }}"
    regexp: 'sandbox_image = "registry.k8s.io/pause:3.8'
    replace: 'sandbox_image = "registry.k8s.io/pause:3.10'
  become: true
  notify: Restart containerd
  changed_when: true

- name: Trigger containerd restart if not ready
  meta: flush_handlers
  notify: Restart containerd

- name: Debug - Containerd setup completed
  debug:
    msg: |
      ✅ Containerd setup completed successfully:
      - Installed
      - Config generated
      - SystemdCgroup enabled
