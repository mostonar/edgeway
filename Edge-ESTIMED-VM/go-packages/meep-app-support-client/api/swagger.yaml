          schema:
            type: string
      responses:
        '200':
          description: >-
            Upon success, a response message content containing an array of the DnsRules is returned.
          headers: {}
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DnsRule'
                description: ''
                example:
                  - - dnsRuleId: DnsRule1
                      domainName: www.example.com
                      ipAddressType: IP_V4
                      ipAddress: 146.241.7.3
                      ttl: 300
                      state: ACTIVE
                    - dnsRuleId: DnsRule2
                      domainName: www.example.com
                      ipAddressType: IP_V4
                      ipAddress: 146.241.7.4
                      ttl: 300
                      state: INACTIVE
              example:
                DnsRules:
                  value:
                    - dnsRuleId: DnsRule1
                      domainName: www.example.com
                      ipAddressType: IP_V4
                      ipAddress: 146.241.7.3
                      ttl: 300
                      state: ACTIVE
                    - dnsRuleId: DnsRule2
