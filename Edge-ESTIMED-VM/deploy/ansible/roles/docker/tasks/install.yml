---

- name: Install Docker engine and components
  apt:
    name:
      - "docker-ce"
      - "docker-ce-cli"
      - "docker-compose-plugin"
    state: present
  notify: Restart docker

- name: Hold Docker packages
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - docker-ce
    - docker-ce-cli
    - docker-compose-plugin

- name: Add user to Docker group
  user:
    name: "{{ target_user }}"
    groups: docker
    append: true

- name: Reset ssh connection to pick up new docker group
  meta: reset_connection

- name: Ensure docker socket is group-accessible
  file:
    path: /var/run/docker.sock
    group: docker
    mode: "0660"
  become: true

# - name: Verify docker access as {{ target_user }}
#   shell: "sg docker -c 'docker info > /dev/null 2>&1'"
#   become: true
#   become_user: "{{ target_user }}"
