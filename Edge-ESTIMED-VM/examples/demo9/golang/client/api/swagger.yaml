openapi: 3.0.0
info:
  title: MEC Sandbox API
  description: The MEC Sandbox API described using OpenAPI
  contact:
    email: cti_support@etsi.org
  license:
    name: BSD-3-Clause
    url: https://forge.etsi.org/legal-matters
  version: 1.0.0
servers:
- url: http://localhost/sandbox-api/v1
paths:
  /login:
    post:
      tags:
      - Authorization
      summary: Initiate OAuth login procedure and creates a MEC Sandbox instance
      description: Initiate OAuth login procedure and creates a MEC Sandbox instance
      operationId: login
      parameters:
      - name: provider
        in: query
        description: Oauth provider
        required: true
        style: form
        explode: true
        schema:
          type: string
          enum:
          - GITHUB
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Oauth'
        "400":
          description: Bad Request
          content: {}
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Not Found
          content: {}
  /namespace:
    get:
      tags:
      - Authorization
      summary: Get the namespace against the User Code
      description: Get the namespace against the User Code
      operationId: GetNamespace
      parameters:
      - name: user_code
        in: query
        description: User Code obtained from the login endpoint
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        "200":
          description: This status code indicates that the request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
        "400":
          description: Bad Request
          content: {}
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Not Found
          content: {}
  /logout:
    post:
      tags:
      - Authorization
      summary: Terminates User Session and delete the Sandbox instance
      description: Terminates User Session and delete the Sandbox instance
      operationId: logout
      parameters:
      - name: sandbox_name
        in: query
        description: Sandbox identifier
        required: true
        style: form
        explode: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content: {}
        "400":
          description: Bad Request
          content: {}
        "401":
          description: Unauthorized
          content: {}
        "404":
          description: Not Found
          content: {}
  /sandboxNetworkScenarios:
    get:
      tags:
      - Sandbox Network Scenarios
      summary: Get the list of the available network scenarios
      description: This method retrieves the list of the available network scenarios.
      operationId: SandboxNetworkScenariosGET
      parameters:
      - name: sandbox_name
        in: query
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      responses:
        "200":
          description: "Upon success, a response message content containing an array\
            \ of the list of the available network scenarios."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxNetworkScenario'
                x-content-type: application/json
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found : No network scenario found."
  /sandboxNetworkScenarios/{sandbox_name}:
    get:
      tags:
      - Sandbox Network Scenarios
      summary: Get description of a Network Scenario to be used.
      description: This method retrive description of a the network scenario
      operationId: SandboxIndividualNetworkScenariosGET
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      - name: network_scenario_id
        in: query
        description: Network scenario to retrieve
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - 4g-5g-macro-v2x
          - 4g-5g-macro-v2x-fed
          - 4g-5g-wifi-macro
          - 4g-macro
          - 4g-wifi-macro
          - dual-mep-4g-5g-wifi-macro
          - dual-mep-short-path
          x-exportParamName: Provider
          x-optionalDataType: String
      responses:
        "200":
          description: "Upon success, an empty response message."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'
                x-content-type: application/json
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found :  used when a client provided a URI that cannot\
            \ be mapped to a valid resource URI."
    post:
      tags:
      - Sandbox Network Scenarios
      summary: Selects the Network Scenario to be activated.
      description: This method selects the network scenario to be activated. This
        request initiates the creation of necessary MEC services for specific network
        scenario
      operationId: SandboxNetworkScenarioPOST
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      - name: network_scenario_id
        in: query
        description: Network scenario to be used
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - 4g-5g-macro-v2x
          - 4g-5g-macro-v2x-fed
          - 4g-5g-wifi-macro
          - 4g-macro
          - 4g-wifi-macro
          - dual-mep-4g-5g-wifi-macro
          - dual-mep-short-path
          x-exportParamName: Provider
          x-optionalDataType: String
      responses:
        "201":
          description: "Upon success, an empty response message."
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found :  used when a client provided a URI that cannot\
            \ be mapped to a valid resource URI."
  /sandboxNetworkScenarios/{sandbox_name}/{network_scenario_id}:
    delete:
      tags:
      - Sandbox Network Scenarios
      summary: Deactivate the Network Scenario.
      description: This method deactivates the network scenario
      operationId: SandboxNetworkScenarioDELETE
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      - name: network_scenario_id
        in: path
        description: Network scenario to be used
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - 4g-5g-macro-v2x
          - 4g-5g-macro-v2x-fed
          - 4g-5g-wifi-macro
          - 4g-macro
          - 4g-wifi-macro
          - dual-mep-4g-5g-wifi-macro
          - dual-mep-short-path
          x-exportParamName: Provider
          x-optionalDataType: String
      responses:
        "204":
          description: "Upon success, an empty response message."
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found :  used when a client provided a URI that cannot\
            \ be mapped to a valid resource URI."
  /apiConsoleLogs/{sandbox_name}:
    get:
      tags:
      - API Console
      summary: Get the list of http logs in the activated scenario.
      description: Get the list of http logs in the activated scenario.
      operationId: ApiConsoleLogsGET
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      responses:
        "200":
          description: "Upon success, a response message content containing an array of the list of the HTTP logs."
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Object representing the HTTP logs.
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found : No Activated Scenario found against the provided sandbox."
  /sandboxUeController/{sandbox_name}:
    get:
      tags:
      - Sandbox UE Controller
      summary: Get the list of the available UEs (e.g. "Stationary UE")
      description: This method retrieves the list of the available available UEs.
      operationId: SandboxUeControllerGET
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      responses:
        "200":
          description: "Upon success, a response message content containing an array\
            \ of the list of the available UEs."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UE'
                x-content-type: application/json
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found : No UE found."
    patch:
      tags:
      - Sandbox UE Controller
      summary: set the new value of the UE
      description: This method sets the new value of the UE.
      operationId: SandboxUeControllerPATCH
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      - name: user_equipment_id
        in: query
        description: User equipmenet identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
          enum:
          - Stationary_UE
          - Low_Velocity_UE
          - High_Velocity_UE
      - name: user_equipment_value
        in: query
        description: It uniquely identifies a UE to set the new value
        required: true
        style: simple
        explode: true
        schema:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
      responses:
        "200":
          description: "Upon success, an empty response message."
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found : No UE found."
  /sandboxMecServices/{sandbox_name}:
    get:
      tags:
      - Sandbox MEC Services
      summary: Get the list of the available MEC services
      description: This method retrieves the list of the available MEC services.
      operationId: SandboxMecServicesGET
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      responses:
        "200":
          description: "Upon success, a response message content containing an array\
            \ of the list of the available MEC services."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxMecServices'
                x-content-type: application/json
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found : No MEC services found."
  /sandboxAppInstances/{sandbox_name}:
    get:
      tags:
      - Sandbox App Instances
      summary: Get the list of the available application instance identifiers
      description: This method retrieves the list of the available application instance
        identifiers
      operationId: SandboxAppInstancesGET
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      responses:
        "200":
          description: "Upon success, a response message content containing an array\
            \ of the list of the available application instance identifier."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationInfo'
                x-content-type: application/json
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found : No application instance identifier found."
    post:
      tags:
      - Sandbox App Instances
      summary: Create a new application instance identifier
      description: This method creates a new application instance
      operationId: SandboxAppInstancesPOST
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      requestBody:
        description: Pet to add to the store
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationInfo'
        required: true
      responses:
        "201":
          description: "Upon success, a response message content containing an array\
            \ of the list of the available application instance identifier."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationInfo'
                x-content-type: application/json
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found : No application instance identifier found."
  /sandboxAppInstances/{sandbox_name}/{app_instance_id}:
    delete:
      tags:
      - Sandbox App Instances
      summary: Delete an existing application instance
      description: This method removes an existing application instance
      operationId: SandboxAppInstancesDELETE
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      - name: app_instance_id
        in: path
        description: It uniquely identifies a MEC application instance identifier
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "204":
          description: No content.
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found : No application instance identifier found."
  /sandboxLogsSubscriptions/{sandbox_name}:
    post:
      tags:
      - Sandbox Logs Subscriptions
      summary: Subscription to receive logs from the sandbox
      description: This method is used to receive logs from the sandbox.
      operationId: SandboxLogsSubscriptionsPOST
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      responses:
        "201":
          description: "Upon success, a response message content containing the subscription\
            \ reference."
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxLogsSubscriptions'
                x-content-type: application/json
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
  /sandboxLogsSubscriptions/{sandbox_name}/{subscription_reference}:
    delete:
      tags:
      - Sandbox Logs Subscriptions
      summary: Subscription to receive logs from the sandbox
      description: This method is used to receive logs from the sandbox.
      operationId: SandboxLogsSubscriptionsDELETE
      parameters:
      - name: sandbox_name
        in: path
        description: Sandbox identifier
        required: true
        style: simple
        explode: true
        schema:
          type: string
      - name: subscription_reference
        in: path
        description: It uniquely identifies subscription reference to receive logs
          from the sandbox
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "204":
          description: "Upon success, an empty response message."
        "400":
          description: "Bad Request : used to indicate that incorrect parameters were\
            \ passed to the request."
        "401":
          description: "Unauthorized : used when the client did not submit credentials."
        "404":
          description: "Not Found : Subscription reference not found."
components:
  schemas:
    SandboxNetworkScenario:
      title: SandboxNetworkScenario
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: The network scenario name.
          example: "[\"4g-5g-macro\"]"
      example:
        id: "[\"4g-5g-macro\"]"
    Scenario:
      type: object
      properties:
        version:
          type: string
          description: Scenario version
        id:
          type: string
          description: Unique scenario ID
        name:
          type: string
          description: Unique scenario name
        description:
          type: string
          description: User description of the scenario.
        config:
          $ref: '#/components/schemas/ScenarioConfig'
        deployment:
          $ref: '#/components/schemas/Deployment'
      description: Scenario object
      example: {}
    ScenarioConfig:
      type: object
      properties:
        visualization:
          type: string
          description: Visualization configuration
        other:
          type: string
          description: Other scenario configuration
      description: Scenario configuration
      example:
        visualization: visualization
        other: other
    Deployment:
      type: object
      properties:
        netChar:
          $ref: '#/components/schemas/NetworkCharacteristics'
        connectivity:
          $ref: '#/components/schemas/ConnectivityConfig'
        d2d:
          $ref: '#/components/schemas/D2dConfig'
        interDomainLatency:
          type: integer
          description: "**DEPRECATED** As of release 1.5.0, replaced by netChar latency"
        interDomainLatencyVariation:
          type: integer
          description: "**DEPRECATED** As of release 1.5.0, replaced by netChar latencyVariation"
        interDomainThroughput:
          type: integer
          description: "**DEPRECATED** As of release 1.5.0, replaced by netChar throughputUl\
            \ and throughputDl"
        interDomainPacketLoss:
          type: number
          description: "**DEPRECATED** As of release 1.5.0, replaced by netChar packetLoss"
          format: double
        meta:
          type: object
          additionalProperties:
            type: string
          description: "Key/Value Pair Map (string, string)"
        userMeta:
          type: object
          additionalProperties:
            type: string
          description: "Key/Value Pair Map (string, string)"
        domains:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
      description: Network deployment object
      example: {}
    NetworkCharacteristics:
      type: object
      properties:
        latency:
          type: integer
          description: Latency in ms
        latencyVariation:
          type: integer
          description: Latency variation in ms
        latencyDistribution:
          type: string
          description: "Latency distribution. Can only be set in the Scenario Deployment\
            \ network characteristics, ignored otherwise. Latency distribution is\
            \ set for the whole network and applied to every end-to-end traffic flows.\
            \ Default value is 'Normal' distribution."
          enum:
          - Normal
          - Pareto
          - Paretonormal
          - Uniform
        throughput:
          type: integer
          description: "**DEPRECATED** As of release 1.5.0, replaced by throughputUl\
            \ and throughputDl"
        throughputDl:
          type: integer
          description: Downlink throughput limit in Mbps
        throughputUl:
          type: integer
          description: Uplink throughput limit in Mbps
        packetLoss:
          type: number
          description: Packet loss percentage
          format: double
      description: Network characteristics object
      example: {}
    ConnectivityConfig:
      type: object
      properties:
        model:
          type: string
          description: "Connectivity Model: <li>OPEN: Any node in the scenario can\
            \ communicate with any node <li>PDU: Terminal nodes (UE) require a PDU\
            \ session to the target DN"
          enum:
          - OPEN
          - PDU
      example: {}
    D2dConfig:
      type: object
      properties:
        d2dMaxDistance:
          type: number
          description: Maximum distance for D2D. Default distance is 100m
        disableD2dViaNetwork:
          type: boolean
          description: Enable-Disable D2D via network. Default value is false
      description: D2D config
    Domain:
      type: object
      properties:
        id:
          type: string
          description: Unique domain ID
        name:
          type: string
          description: Domain name
        type:
          type: string
          description: Domain type
          enum:
          - OPERATOR
          - OPERATOR-CELLULAR
          - PUBLIC
        netChar:
          $ref: '#/components/schemas/NetworkCharacteristics'
        interZoneLatency:
          type: integer
          description: "**DEPRECATED** As of release 1.5.0, replaced by netChar latency"
        interZoneLatencyVariation:
          type: integer
          description: "**DEPRECATED** As of release 1.5.0, replaced by netChar latencyVariation"
        interZoneThroughput:
          type: integer
          description: "**DEPRECATED** As of release 1.5.0, replaced by netChar throughputUl\
            \ and throughputDl"
        interZonePacketLoss:
          type: number
          description: "**DEPRECATED** As of release 1.5.0, replaced by netChar packetLoss"
          format: double
        meta:
          type: object
          additionalProperties:
            type: string
          description: "Key/Value Pair Map (string, string)"
        userMeta:
          type: object
          additionalProperties:
            type: string
          description: "Key/Value Pair Map (string, string)"
        cellularDomainConfig:
          $ref: '#/components/schemas/CellularDomainConfig'
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
      description: Operator domain object
      example: {}
    CellularDomainConfig:
      type: object
      properties:
        mnc:
          type: string
          description: Mobile Network Code part of PLMN identity as defined in ETSI
            TS 136 413
        mcc:
          type: string
          description: Mobile Country Code part of PLMN identity as defined in ETSI
            TS 136 413
        defaultCellId:
          type: string
          description: The E-UTRAN Cell Identity as defined in ETSI TS 136 413 if
            no cellId is defined for the cell or if not applicable
      description: Cellular domain configuration information
      example: {}
    Zone:
      type: object
      properties:
        id:
          type: string
          description: Unique zone ID
        name:
          type: string
          description: Zone name
        type:
          type: string
          description: Zone type
          enum:
          - ZONE
          - COMMON
        netChar:
          $ref: '#/components/schemas/NetworkCharacteristics'
        interFogLatency:
          type: integer
          description: "**DEPRECATED** As of release 1.3.0, no longer supported"
        interFogLatencyVariation:
          type: integer
          description: "**DEPRECATED** As of release 1.3.0, no longer supported"
        interFogThroughput:
          type: integer
          description: "**DEPRECATED** As of release 1.3.0, no longer supported"
        interFogPacketLoss:
          type: number
          description: "**DEPRECATED** As of release 1.3.0, no longer supported"
          format: double
        interEdgeLatency:
          type: integer
          description: "**DEPRECATED** As of release 1.3.0, no longer supported"
        interEdgeLatencyVariation:
          type: integer
          description: "**DEPRECATED** As of release 1.3.0, no longer supported"
        interEdgeThroughput:
          type: integer
          description: "**DEPRECATED** As of release 1.3.0, no longer supported"
        interEdgePacketLoss:
          type: number
          description: "**DEPRECATED** As of release 1.3.0, no longer supported"
          format: double
        edgeFogLatency:
          type: integer
          description: "**DEPRECATED** As of release 1.3.0, replaced by netChar latency"
        edgeFogLatencyVariation:
          type: integer
          description: "**DEPRECATED** As of release 1.3.0, replaced by netChar latencyVariation"
        edgeFogThroughput:
          type: integer
          description: "**DEPRECATED** As of release 1.3.0, replaced by netChar throughput"
        edgeFogPacketLoss:
          type: number
          description: "**DEPRECATED** As of release 1.3.0, replaced by netChar packetLoss"
          format: double
        meta:
          type: object
          additionalProperties:
            type: string
          description: "Key/Value Pair Map (string, string)"
        userMeta:
          type: object
          additionalProperties:
            type: string
          description: "Key/Value Pair Map (string, string)"
        networkLocations:
          type: array
          items:
            $ref: '#/components/schemas/NetworkLocation'
      description: Logical zone (MEC network) object
      example: {}
    NetworkLocation:
      type: object
      properties:
        id:
          type: string
          description: Unique network location ID
        name:
          type: string
          description: Network location name
        type:
          type: string
          description: Network location type
          enum:
          - POA
          - POA-4G
          - POA-5G
          - POA-WIFI
          - DEFAULT
        netChar:
          $ref: '#/components/schemas/NetworkCharacteristics'
        terminalLinkLatency:
          type: integer
          description: "**DEPRECATED** As of release 1.5.0, replaced by netChar latency"
        terminalLinkLatencyVariation:
          type: integer
