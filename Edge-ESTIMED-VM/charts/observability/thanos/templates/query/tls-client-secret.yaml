{{- if and .Values.query.enabled .Values.query.grpcTLS.client.secure (not .Values.query.grpcTLS.client.existingSecret.name) }}
{{- $queryClientKeyMap := .Values.query.grpcTLS.client.existingSecret.keyMapping | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-query-tls-client" (include "thanos.fullname" .) }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
  annotations:
    {{- include "thanos.annotations" (dict "Values" .Values "component" "query") | nindent 4 }}
type: Opaque
data:
  {{- if .Values.query.grpcTLS.client.cert }}
  {{ index $queryClientKeyMap "tls-cert" | default "tls-cert" }}: {{ .Values.query.grpcTLS.client.cert | b64enc | quote }}
  {{- end }}
  {{- if .Values.query.grpcTLS.client.key }}
  {{ index $queryClientKeyMap "tls-key" | default "tls-key" }}: {{ .Values.query.grpcTLS.client.key | b64enc | quote }}
  {{- end }}
  {{- if .Values.query.grpcTLS.client.ca }}
  {{ index $queryClientKeyMap "ca-cert" | default "ca-cert" }}: {{ .Values.query.grpcTLS.client.ca | b64enc | quote }}
  {{- end }}
{{- end }}
