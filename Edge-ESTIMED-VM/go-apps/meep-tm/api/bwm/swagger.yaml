                      schema:
                        $ref: '#/components/schemas/ProblemDetails'
                '429':
                  description: "Too Many Requests: A rate limiter has triggered."
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/ProblemDetails'
