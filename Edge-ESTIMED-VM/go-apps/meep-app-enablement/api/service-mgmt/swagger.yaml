                          - OAUTH2_CLIENT_CREDENTIALS
                          tokenEndpoint: /mecSerMgmtApi/security/TokenEndPoint
                    serializer: JSON
                    _links:
                      self:
                        href: http://example.com/
                  - serInstanceId: ServiceInstance345
                    serName: ExampleService
                    serCategory:
                      href: catItem1
                      id: id12345
                      name: RNI
                      version: version1
                    version: ServiceVersion1
                    state: ACTIVE
                    transportInfo:
                      id: TransId12345
                      name: REST
                      description: REST API
                      type: REST_HTTP
                      protocol: HTTP
                      version: "2.0"
                      endpoint:
                        addresses:
                        - host: 192.0.2.1
                          port: 8080
                      security:
                        oAuth2Info:
                          grantTypes:
                          - OAUTH2_CLIENT_CREDENTIALS
                          tokenEndpoint: /mecSerMgmtApi/security/TokenEndPoint
                    serializer: JSON
                    _links:
                      self:
                        href: http://example.com/
        "400":
          description: Bad Request. It is used to indicate that incorrect parameters
