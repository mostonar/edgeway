{{- if and .Values.query.enabled .Values.query.grpcTLS.server.secure (not .Values.query.grpcTLS.server.existingSecret.name) }}
{{- $queryServerKeyMap := .Values.query.grpcTLS.server.existingSecret.keyMapping | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-query-tls-server" (include "thanos.fullname" .) }}
  labels:
    {{- include "thanos.labels" . | nindent 4 }}
    app.kubernetes.io/component: query
  annotations:
    {{- include "thanos.annotations" (dict "Values" .Values "component" "query") | nindent 4 }}
type: Opaque
data:
  {{ index $queryServerKeyMap "tls-cert" | default "tls-cert" }}: {{ .Values.query.grpcTLS.server.cert | default "" | b64enc | quote }}
  {{ index $queryServerKeyMap "tls-key" | default "tls-key" }}: {{ .Values.query.grpcTLS.server.key | default "" | b64enc | quote }}
  {{- if .Values.query.grpcTLS.server.ca }}
  {{ index $queryServerKeyMap "ca-cert" | default "ca-cert" }}: {{ .Values.query.grpcTLS.server.ca | b64enc | quote }}
  {{- end }}
{{- end }}
