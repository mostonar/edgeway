openapi: 3.0.0
info:
  title: MEC service management realized by CAPIF APIs
  description: The ETSI MEC ISG MEC011 MEC Service Management realized by CAPIF APIs
    described using OpenAPI
  contact:
    email: cti_support@etsi.org
  license:
    name: BSD-3-Clause
    url: https://forge.etsi.org/legal-matters
  version: 3.2.1
externalDocs:
  description: "ETSI GS MEC011 Application Enablement API, V3.2.1"
  url: https://www.etsi.org/deliver/etsi_gs/MEC/001_099/011/03.02.01_60/gs_mec011v030201p.pdf
servers:
- url: https://localhost/sandboxname/service-apis/v1
  description: Service APIs
- url: https://localhost/sandboxname/published-apis/v1
  description: Published APIs
- url: https://localhost/sandboxname/capif-events/v1
  description: CAPIF Events APIs
tags:
- name: services
- name: appServices
- name: appSubscriptions
- name: callbacks
paths:
  /allServiceAPIs:
    get:
      tags:
      - services
      description: This method retrieves information about a list of mecService resources.
        This method is typically used in "service availability query" procedure
      operationId: Services_GET
      parameters:
      - name: vend-spec-etsi-mec-serinstance-id
        in: query
        description: Vendor-specific query parameter for service instance ID. The
          "target" attribute shall be set to "/apiId".
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: "{\"target\": \"/apiId\", \"value\": \"serviceInstanceId\"}"
      - name: api-name
        in: query
        description: "This query parameter corresponds to the parameter \"ser_name\"\
          \ as defined in clause 8.2.3.3.1. As opposed to the cardinality of ser_instance_id\
          \ defined in clause 8.2.3.3.1 that is 0..N, this parameter only supports\
          \ a cardinality of 0..1."
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: api-invoker-id
        in: query
        description: "If the Discover_Service_API is produced by the MEC platform\
          \ towards the MEC applications, this identifier shall be set to the value\
          \ of the \"appInstanceId\" (see clause 7.1.2.6). If the Discover_Service_API\
          \ is produced by the CCF, the provisions in clause 8.1.2.2.3.1 of 3GPP TS\
          \ 29.222 [21] apply. "
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: vend-spec-etsi-mec-sercategory-id
        in: query
        description: Vendor-specific query parameter for service category ID. The
          "target" attribute shall be set to "/vendorSpecific-urn:etsi:mec:capifext:service-info/serCategory/id".
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: "{\"target\": \"/vendorSpecific-urn:etsi:mec:capifext:service-info/serCategory/id\"\
            , \"value\": \"serviceCategoryId\"}"
      - name: vend-spec-etsi-mec-consumed-local-only
        in: query
        description: Vendor-specific query parameter for consumed local only. The
          "target" attribute shall be set to "/vendorSpecific-urn:etsi:mec:capifext:service-info/consumedLocalOnly".
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: "{\"target\": \"/vendorSpecific-urn:etsi:mec:capifext:service-info/consumedLocalOnly\"\
            , \"value\": \"true\"}"
      - name: vend-spec-etsi-mec-is-local
        in: query
        description: Vendor-specific query parameter for is local. The "target" attribute
          shall be set to "/vendorSpecific-urn:etsi:mec:capifext:service-info/isLocal".
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: "{\"target\": \"/vendorSpecific-urn:etsi:mec:capifext:service-info/isLocal\"\
            , \"value\": \"true\"}"
      - name: vend-spec-etsi-mec-scope-of-locality
        in: query
        description: Vendor-specific query parameter for scope of locality. The "target"
          attribute shall be set to "/vendorSpecific-urn:etsi:mec:capifext:service-info/scopeOfLocality".
        required: false
        style: form
        explode: true
        schema:
          type: string
          example: "{\"target\": \"/vendorSpecific-urn:etsi:mec:capifext:service-info/scopeOfLocality\"\
            , \"value\": \"scopeOfLocalityValue\"}"
      responses:
        "200":
          description: |
            The response body contains the result of the search over the list of registered APIs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveredAPIs'
        "307":
          description: |
            Temporary redirection. The response shall include a Location header field containing an alternative target URI of the resource located in an alternative CCF.
          headers:
            Location:
              description: Contains an alternative target URI of the resource located
                in an alternative CCF.
              style: simple
              explode: false
              schema:
                type: string
        "308":
          description: |
            Permanent redirection. The response shall include a Location header field containing an alternative target URI of the resource located in an alternative CCF.
          headers:
            Location:
              description: Contains an alternative target URI of the resource located
                in an alternative CCF.
              style: simple
              explode: false
              schema:
                type: string
        "400":
          description: Bad Request. It is used to indicate that incorrect parameters
            were passed to the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Forbidden. The operation is not allowed given the current status
            of the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: Not Found. It is used when a client provided a URI that cannot
            be mapped to a valid resource URI.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "414":
          description: It is used to indicate that the server is refusing to process
            the request because the request URI is longer than the server is willing
            or able to process.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    servers:
    - url: https://localhost/sandboxname/service-apis/v1
  /{apfId}/service-apis:
    get:
      tags:
      - appServices
      summary: get services
      description: This method retrieves information about a list of mecService resources.
        This method is typically used in "service availability query" procedure
      operationId: AppServices_GET
      parameters:
      - name: apfId
        in: path
        description: "Identifier of the entity that registers the service API. If\
          \ the MEC app plays the role of the APF, this variable shall be set to the\
          \ value of the \"appInstanceId\" (see clause 7.1.2.6). If the MEC platform\
          \ plays the role of the APF, this variable shall be set to a specific identifier\
          \ that identifies the MEC platform. "
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: |
            Successful case. The representation(s) of the "Individual APF published API" resource(s) of the  requested service API(s) shall be returned in the response body. If there are no active "Individual APF published API" resources at the CCF, an empty array is  returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceAPIDescription'
                x-content-type: application/json
        "307":
          description: |
            Temporary redirection. The response shall include a Location header field containing an alternative  target URI of the resource located in an alternative CCF.
          headers:
            Location:
              description: |
                Contains an alternative target URI of the resource located in an alternative CCF.
              style: simple
              explode: false
              schema:
                type: string
        "308":
          description: |
            Permanent redirection. The response shall include a Location header field containing an alternative  target URI of the resource located in an alternative CCF.
          headers:
            Location:
              description: |
                Contains an alternative target URI of the resource located in an alternative CCF.
              style: simple
              explode: false
              schema:
                type: string
        "400":
          description: Bad Request. It is used to indicate that incorrect parameters
            were passed to the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Forbidden. The operation is not allowed given the current status
            of the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: Not Found. It is used when a client provided a URI that cannot
            be mapped to a valid resource URI.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - appServices
      summary: Publish a new API
      description: Enables a service consumer to request to publish a new API at the
        CCF.
      operationId: AppServices_POST
      parameters:
      - name: apfId
        in: path
        description: "Identifier of the entity that registers the service API. If\
          \ the MEC app plays the role of the APF, this variable shall be set to the\
          \ value of the \"appInstanceId\" (see clause 7.1.2.6). If the MEC platform\
          \ plays the role of the APF, this variable shall be set to a specific identifier\
          \ that identifies the MEC platform. "
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAPIDescription'
        required: true
      responses:
        "201":
          description: |
            Successful case. The service API is successfully published. The URI of the created "Individual APF published API"  resource shall be returned in an HTTP "Location" header.
          headers:
            Location:
              description: |
                Contains the URI of the newly created resource, according to the structure: {apiRoot}/published-apis/<apiVersion>/{apfId}/service-apis/{serviceApiId}
              style: simple
              explode: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAPIDescription'
    servers:
    - url: https://localhost/sandboxname/published-apis/v1
  /{apfId}/service-apis/{serviceApiId}:
    get:
      tags:
      - appServices
      description: The HTTP GET method allows a service consumer to retrieve an existing
        "Individual APF published API" resource at  the CCF.
      operationId: AppServicesServiceId_GET
      parameters:
      - name: apfId
        in: path
        description: "Identifier of the entity that registers the service API. If\
          \ the MEC app plays the role of the APF, this variable shall be set to the\
          \ value of the \"appInstanceId\" (see clause 7.1.2.6). If the MEC platform\
          \ plays the role of the APF, this variable shall be set to a specific identifier\
          \ that identifies the MEC platform. "
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: serviceApiId
        in: path
        description: Represents a MEC service instance.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: |
            Successful case. The service API is successfully  published and a representation of the created  "Individual APF published API" resource shall be  returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceAPIDescription'
                x-content-type: application/json
        "307":
          description: |
            Temporary redirection. The response shall include a Location header field containing an alternative  target URI of the resource located in an alternative CCF.
          headers:
