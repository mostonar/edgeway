        description: Represents a MEC service instance.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAPIDescription'
        required: true
      responses:
        "200":
          description: |
            Successful case. The service API is successfully  published and a representation of the created  "Individual APF published API" resource shall be  returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceAPIDescription'
                x-content-type: application/json
        "204":
          description: Successful case. The "Individual APF published API" resource
            is successfully updated and no content is returned in the response body.
        "307":
          description: |
            Temporary redirection. The response shall include a Location header field containing an alternative  target URI of the resource located in an alternative CCF.
          headers:
            Location:
              description: |
                Contains an alternative target URI of the resource located in an alternative CCF.
              style: simple
              explode: false
              schema:
                type: string
        "308":
          description: |
            Permanent redirection. The response shall include a Location header field containing an alternative  target URI of the resource located in an alternative CCF.
          headers:
            Location:
              description: |
                Contains an alternative target URI of the resource located in an alternative CCF.
              style: simple
              explode: false
              schema:
                type: string
        "400":
          description: Bad Request. It is used to indicate that incorrect parameters
            were passed to the request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: Forbidden. The operation is not allowed given the current status
            of the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: Not Found. It is used when a client provided a URI that cannot
            be mapped to a valid resource URI.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "412":
          description: "Precondition Failed. It is used when a condition has failed\
            \ during conditional requests, e.g. when using ETags to avoid write conflicts."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
      - appServices
      description: The HTTP DELETE method allows a service consumer to delete an existing
        "Individual APF published API" resource  at the CCF
      operationId: AppServicesServiceId_DELETE
      parameters:
      - name: apfId
        in: path
        description: "Identifier of the entity that registers the service API. If\
          \ the MEC app plays the role of the APF, this variable shall be set to the\
          \ value of the \"appInstanceId\" (see clause 7.1.2.6). If the MEC platform\
          \ plays the role of the APF, this variable shall be set to a specific identifier\
