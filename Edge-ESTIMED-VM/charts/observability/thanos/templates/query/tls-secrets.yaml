{{- if .Values.query.enabled }}
{{- $http := .Values.query.ingress.http.enabled | ternary .Values.query.ingress.http .Values.query.ingress }}
{{- if and $http.enabled $http.secrets }}
{{- range $http.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  labels:
    {{- include "thanos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: query
  annotations:
    {{- include "thanos.annotations" (dict "Values" $.Values "component" "query") | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .certificate | b64enc }}
  tls.key: {{ .key | b64enc }}
---
{{- end }}
{{- end }}
{{- if and .Values.query.ingress.grpc.enabled .Values.query.ingress.grpc.secrets }}
{{- range .Values.query.ingress.grpc.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  labels:
    {{- include "thanos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: query
  annotations:
    {{- include "thanos.annotations" (dict "Values" $.Values "component" "query") | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .certificate | b64enc }}
  tls.key: {{ .key | b64enc }}
---
{{- end }}
{{- end }}
{{- end }}
