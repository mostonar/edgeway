          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    BwChgEventSubscription:
      type: object
      required:
        - subscriptionType
        - filterCriteria
      properties:
        subscriptionType:
          type: string
          description: Shall be set to "BwChgEventSubscription".
          x-etsi-mec-cardinality: 1
          x-etsi-mec-origin-type: String
        callbackReference:
          type: string
          format: uri
          description: URI exposed by the client on which to receive notifications via HTTP. See note 1.
          x-etsi-mec-cardinality: 0..1
          x-etsi-mec-origin-type: Uri
        websockNotifConfig:
          $ref: '#/components/schemas/WebsockNotifConfig'
        _links:
          $ref: '#/components/schemas/BwChgEventSubscription_links'
        filterCriteria:
          type: array
          items:
            type: object
            description: List of filtering criteria for the BW change event subscription. Any filtering \
              \ criteria from below, which is included in the request, shall also be included in the response.
            required:
              - appInsId
            properties:
              appInsId:
                type: string
                description: Application instance identifier.
                x-etsi-mec-cardinality: 1
                x-etsi-mec-origin-type: String
              ueIp:
                type: string
                description: Source address identity of session. See note 2.
                x-etsi-mec-cardinality: 0..1
                x-etsi-mec-origin-type: String
      x-etsi-notes: "NOTE 1: At least one of callbackReference and websockNotifConfig shall be provided by the \
        \ service consumer. If both are provided, it is up to BWM service to choose an alternative and return only \
        \ that alternative in the response, as described in ETSI GS MEC 009 [6], clause 6.12a. \
        \ NOTE 2: For the case of session specific bw allocation, ueIp shall be used to identify subscription per UE per application."
    WebsockNotifConfig:
      type: object
      properties:
        websocketUri:
          type: string
          format: uri
          description: Set by BWM service to indicate to the service consumer the web socket URI to be used for delivering notifications.
          x-etsi-mec-cardinality: 0..1
          x-etsi-mec-origin-type: Uri
        requestWebsocketUri:
          type: boolean
          description: Set to TRUE by the service consumer to indicate that Websocket delivery is requested.
