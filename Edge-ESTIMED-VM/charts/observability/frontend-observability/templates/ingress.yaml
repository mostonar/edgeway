apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-alloy
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
  - http:
      paths:
      - path: /telemetry/(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: grafana-alloy
            port:
              number: 12345
