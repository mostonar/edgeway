            application/json:
              schema:
                $ref: '#/components/schemas/TrafficRule'
              example:
                TrafficRule:
                  value:
                    trafficRuleId: TrafficRule123
                    filterType: FLOW
                    priority: 1
                    trafficFilter:
                      - srcAddress:
                          - 192.127.4.100/32
                          - 192.127.4.101/32
                        dstAddress:
                          - 192.127.4.102/32
                          - 192.127.4.103/32
                        srcPort:
                          - '80'
                        dstPort:
                          - '80'
                    action: FORWARD_DECAPSULATED
                    dstInterface:
                      - dstInterface: null
                        interfaceType: IP
                        tunnelInfo: tunnel
                        dstIpAddress: 20.1.1.1
                    state: ACTIVE
        '400':
          description: >-
            Bad Request. It is used to indicate that incorrect parameters were passed to the request.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
        '403':
          description: >-
            Forbidden. The operation is not allowed given the current status of the resource.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            Not Found. It is used when a client provided a URI that cannot be mapped  to a valid resource URI.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
      deprecated: false
    put:
      tags:
        - unsupported
      summary: Update the information about a mecTrafficRule resource
      description: >-
        This method retrieves information about all the traffic rules associated with a MEC application instance.
      operationId: ApplicationsTrafficRule_PUT
      parameters:
        - name: appInstanceId
          in: path
          description: >-
            Represents a MEC application instance. Note that the appInstanceId
            is allocated by the MEC platform manager.
          required: true
          style: simple
          schema:
            type: string
        - name: trafficRuleId
          in: path
          description: Represents a traffic rule.
          required: true
          style: simple
          schema:
            type: string
      requestBody:
        description: >-
          One or more updated attributes that are allowed to be changed are included in the TrafficRule data structure in the message content of the request.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrafficRule'
        required: true
      responses:
        '200':
          description: >-
            Upon success, a response message content containing data type describing the updated TrafficRule is returned.
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrafficRule'
              example:
                TrafficRule:
                  value:
                    trafficRuleId: TrafficRule123
                    serName: ExampleService
                    filterType: FLOW
                    priority: 1
                    trafficFilter:
                      - srcAddress:
                          - 192.127.4.100/32
                          - 192.127.4.101/32
                        dstAddress:
                          - 192.127.4.102/32
                          - 192.127.4.103/32
                        srcPort:
                          - '80'
                        dstPort:
                          - '80'
                    action: FORWARD_DECAPSULATED
                    dstInterface:
                      - dstInterface0: null
                        interfaceType: IP
                        tunnelInfo: tunnel
                        dstIpAddress: 20.1.1.1
                    state: ACTIVE
        '400':
          description: >-
            Bad Request. It is used to indicate that incorrect parameters were passed to the request.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
        '403':
          description: >-
            Forbidden. The operation is not allowed given the current status of the resource.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: >-
            Not Found. It is used when a client provided a URI that cannot be mapped  to a valid resource URI.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
        '412':
          description: >-
            Precondition Failed. It is used when a condition has failed during conditional requests,  e.g. when using ETags to avoid write conflicts.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                type: object
                description: Empty schema
      deprecated: false
    parameters: []
  /applications/{appInstanceId}/dns_rules:
    get:
      tags:
        - unsupported
      summary: Retrieve information about a list of mecDnsRule resources for an application instance
      description: >-
        This method retrieves information about all the DNS rules associated with a MEC application instance.
      operationId: ApplicationsDnsRules_GET
      parameters:
        - name: appInstanceId
          in: path
          description: >-
            Represents a MEC application instance. Note that the appInstanceId is allocated by the MEC platform manager.
          required: true
