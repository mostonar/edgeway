openapi: 3.0.0
info:
  title: AdvantEDGE Location API
  version: 3.1.1
  description: "Location Service is AdvantEDGE's implementation of
  [ETSI MEC ISG MEC013 Location API](https://www.etsi.org/deliver/etsi_gs/MEC/001_099/013/03.01.01_60/gs_mec013v030101p.pdf)
  <p>The API is based on the Open Mobile Alliance's specification RESTful Network API for Zonal Presence
  <p>[Copyright (c) ETSI 2017](https://forge.etsi.org/etsi-forge-copyright-notice.txt)
  <p>**Micro-service**<br>[meep-loc-serv](https://github.com/InterDigitalInc/AdvantEDGE/tree/master/go-apps/meep-loc-serv)
  <p>**Type & Usage**<br>Edge Service used by edge applications that want to get information about Users (UE) and Zone locations
  <p>**Note**<br>AdvantEDGE supports all of Location API endpoints (see below)."
  license:
    name: Apache 2.0
    url: 'https://github.com/InterDigitalInc/AdvantEDGE/blob/master/LICENSE'
  contact:
    name: InterDigital AdvantEDGE Support
    email: AdvantEDGE@InterDigital.com
externalDocs:
  description: ETSI MEC013 V3.1.1 Location API
  url: 'https://www.etsi.org/deliver/etsi_gs/MEC/001_099/013/03.01.01_60/gs_mec013v030101p.pdf'
servers:
  - url: 'https://localhost/sandboxname/location/v3'
tags:
  - name: 'location'
paths:
  /queries/distance:
    get:
      tags:
        - 'location'
      summary: 'UE Distance Lookup of a specific UE'
      description: 'UE Distance Lookup between terminals or a terminal and a location'
      operationId: distanceGET
      parameters:
        - $ref: '#/components/parameters/Query.Requester'
        - $ref: '#/components/parameters/Query.AddressMandatory'
        - $ref: '#/components/parameters/Query.Latitude'
        - $ref: '#/components/parameters/Query.Longitude'
      responses:
        '200':
          description: 'Successful response to a distance request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineTerminalDistance'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'queries'
  /queries/users:
    get:
      tags:
        - 'location'
      summary: 'UE Location Lookup of a specific UE or group of UEs'
      description: 'UE Location Lookup of a specific UE or group of UEs'
      operationId: usersGET
      parameters:
        - $ref: '#/components/parameters/Query.ZoneId'
        - $ref: '#/components/parameters/Query.AccessPointId'
        - $ref: '#/components/parameters/Query.Address'
      responses:
        '200':
          description: 'Successful response to users request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineUserList'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'queries'
  /queries/zones:
    get:
      tags:
        - 'location'
      summary: 'Zones information Lookup'
      description: 'Used to get a list of identifiers for zones authorized for use by the application.'
      operationId: zonesGET
      responses:
        '200':
          description: 'Successful response to zones request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineZoneList'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'queries'
  /queries/zones/{zoneId}:
    get:
      tags:
        - 'location'
      summary: 'Zones information Lookup'
      description: 'Used to get the information for an authorized zone for use by the application.'
      operationId: zonesGetById
      parameters:
        - $ref: '#/components/parameters/Path.ZoneId'
      responses:
        '200':
          description: 'Successful response to an access point Id request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineZoneInfo'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'queries'
  /queries/zones/{zoneId}/accessPoints:
    get:
      tags:
        - 'location'
      summary: 'Radio Node Location Lookup'
      description: 'Radio Node Location Lookup to retrieve a list of radio nodes associated to a zone.'
      operationId: apGET
      parameters:
        - $ref: '#/components/parameters/Path.ZoneId'
        - $ref: '#/components/parameters/Query.InterestRealm'
      responses:
        '200':
          description: 'Successful response to an access point Id request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineAccessPointList'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'queries'
  /queries/zones/{zoneId}/accessPoints/{accessPointId}:
    get:
      tags:
        - 'location'
      summary: 'Radio Node Location Lookup'
      description: 'Radio Node Location Lookup to retrieve a radio node associated to a zone.'
      operationId: apByIdGET
      parameters:
        - $ref: '#/components/parameters/Path.ZoneId'
        - $ref: '#/components/parameters/Path.AccessPointId'
      responses:
        '200':
          description: 'Successful response to an access point Id request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineAccessPointInfo'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'queries'
  /subscriptions/area:
    get:
      tags:
        - 'location'
      summary: 'Retrieves information about the subscriptions for this requestor.'
      description: 'The GET method is used to request information about the subscriptions for this requestor.'
      operationId: areaSubListGET
      parameters:
        - name: subscription_type
          in: query
          description: Filter subscriptions by type
          schema:
            type: string
            enum: [Event]
          required: false
      responses:
        '200':
          description: "Upon success, a response body containing the list of links to requestor's subscriptions is returned."
          content:
            application/json:
              schema:
                type: object
                required:
                  - notificationSubscriptionList
                properties:
                  notificationSubscriptionList:
                    $ref: '#/components/schemas/InlineNotificationSubscriptionList'
                example:
                  - notificationSubscriptionList:
                      subscription:
                        - href: 'http://meAppServer.example.com/location/v2/subscriptions/area/subscription123'
                          subscriptionType: 'UserAreaSubscription'
                      resourceURL:
                          href: 'http://meAppServer.example.com/location/v2/subscriptions/area'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
    post:
      tags:
        - 'location'
      summary: 'Creates subscription to area notifications.'
      description: 'The POST method is used to create a new subscription to area notifications.'
      operationId: areaSubPOST
      requestBody:
        description: 'Subscription to be created'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userAreaSubscription:
                  $ref: '#/components/schemas/InlineUserAreaSubscription'
              example:
                - userAreaSubscription:
                    subscriptionType: 'userAreaSubscription'
                    clientCorrelator: '0123'
                    callbackReference: 'http://my.callback.com/area_notification/some-id'
                    _links:
                      self:
                        href: http://meAppServer.example.com/location/v2/subscriptions/area/subscription123
                    areaDefine:
                      shape: 1
                      points:
                        - latitude: -80.86302
                          longitude: 41.277306
                      radius:
                    addressList:
                      - acr:10.0.0.1
                      - acr:10.0.0.2
                    trackingAccuracy: 10.99
                    expiryDeadline:
                      seconds: 1973507343
                      nanoSeconds": 0
      responses:
        '201':
          description: 'Indicates successful resource creation, where the resource URI shall be returned in the HTTP Location header field.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  userAreaSubscription:
                    $ref: '#/components/schemas/InlineUserAreaSubscription'
                example:
                  - userAreaSubscription:
                      subscriptionType: 'userAreaSubscription'
                      clientCorrelator: '0123'
                      callbackReference: 'http://my.callback.com/area_notification/some-id'
                      _links:
                        self:
                          href: http://meAppServer.example.com/location/v2/subscriptions/area/subscription123
                      areaDefine:
                      shape: 1
                      points:
                        - latitude: -80.86302
                          longitude: 41.277306
                      radius:
                      addressList:
                        - acr:10.0.0.1
                        - acr:10.0.0.2
                      trackingAccuracy: 10.99
                      expiryDeadline:
                        seconds: 1973507343
                        nanoSeconds": 0
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '415':
          $ref: '#/components/responses/415'
        '429':
          $ref: '#/components/responses/429'
      callbacks:
        notification:
          '{$request.body#/userAreaSubscription.callbackReference}':
            post:
              summary: 'Callback POST used to send a notification'
              description: 'Notification from Location service, content based on subscription type'
              operationId: areaNotificationPOST
              requestBody:
                description: 'Subscription notification'
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        userAreaNotification:
                          $ref: '#/components/schemas/InlineUserAreaNotification'
                      example:
                        - userAreaNotification:
                            notificationType: 'UserAreaNotification'
                            timeStamp:
                              seconds: 1673507343
                              nanoSeconds": 0
                            address: 'acr:10.0.0.1'
                            userLocationEvent: 'ENTERING_AREA_EVENT'
                            _links:
                              subscription:
                                href: http://meAppServer.example.com/location/v2/subscriptions/area/subscription123
              responses:
                '204':
                  $ref: '#/components/responses/204'
      x-swagger-router-controller: 'subscriptions'

  /subscriptions/area/{subscriptionId}:
    get:
      tags:
        - 'location'
      summary: 'Retrieve subscription information'
      description: 'The GET method is used to retrieve information about this subscription.'
      operationId: areaSubGET
      parameters:
        - $ref: '#/components/parameters/Path.SubscrId'
      responses:
        '200':
          description: 'Upon success, a response body containing data type describing the specific zone subscription is returned.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - userAreaSubscription
                properties:
                  userAreaNotification:
                    $ref: '#/components/schemas/InlineUserAreaSubscription'
                example:
                  - userAreaNotification:
                      notificationType: 'UserAreaNotification'
                      address: 'acr:10.0.0.1'
                      userLocationEvent: 'ENTERING_AREA_EVENT'
                      _links:
                        subscription:
                          href: http://meAppServer.example.com/location/v2/subscriptions/area/subscription123
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'subscriptions'
    put:
      tags:
        - 'location'
      summary: 'Updates a subscription information'
      description: 'The PUT method is used to update the existing subscription.'
      operationId: areaSubPUT
      requestBody:
        description: 'Subscription to be modified'
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userAreaNotification:
                  $ref: '#/components/schemas/InlineUserAreaSubscription'
              example:
                - userAreaNotification:
                    notificationType: 'UserAreaNotification'
                    address: 'acr:10.0.0.1'
                    userLocationEvent: 'ENTERING_AREA_EVENT'
                    _links:
                      subscription:
                        href: http://meAppServer.example.com/location/v2/subscriptions/area/subscription123
      parameters:
        - $ref: '#/components/parameters/Path.SubscrId'
      responses:
        '200':
          description: 'Upon success, a response body containing data type describing the updated subscription is returned.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  userAreaNotification:
                    $ref: '#/components/schemas/InlineUserAreaSubscription'
                example:
                  - userAreaNotification:
                      notificationType: 'UserAreaNotification'
                      address: 'acr:10.0.0.1'
                      userLocationEvent: 'ENTERING_AREA_EVENT'
                      _links:
                        subscription:
                          href: http://meAppServer.example.com/location/v2/subscriptions/area/subscription123
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '412':
          $ref: '#/components/responses/412'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'subscriptions'
    delete:
      tags:
        - 'location'
      summary: 'Cancel a subscription'
      description: 'The DELETE method is used to cancel the existing subscription.'
      operationId: areaSubDELETE
      parameters:
        - $ref: '#/components/parameters/Path.SubscrId'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'subscriptions'

  /subscriptions/distance:
    get:
      tags:
        - 'location'
      summary: 'Retrieves all active subscriptions to distance change notifications'
      description: 'This operation is used for retrieving all active subscriptions to a distance change notifications.'
      operationId: distanceSubListGET
      responses:
        '200':
          description: 'Response to retrieve area subscriptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineNotificationSubscriptionList'
                example:
                  - notificationSubscriptionList:
                      subscription:
                        - href: 'http://meAppServer.example.com/location/v2/subscriptions/distance/subscription123'
                          subscriptionType: 'UserDistanceSubscription'
                      resourceURL:
                          href: 'http://meAppServer.example.com/location/v2/subscriptions/distance'

    post:
      tags:
        - 'location'
      summary: 'Creates a subscription for distance change notification'
      description: 'Creates a subscription to the Location Service for a distance change notification.'
      operationId: distanceSubPOST
      requestBody:
        description: 'Subscription to be created'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InlineUserDistanceNotification'
            example:
                userDistanceSubscription:
                  subscriptionType: 'UserDistanceSubscription'
                  clientCorrelator: '0123'
                  callbackReference: 'http://my.callback.com/user-distance/some-id'
                  referenceAddress:
                    - 'acr:10.0.0.3'
                  monitoredAddress:
                    - 'acr:10.0.0.1'
                    - 'acr:10.0.0.2'
                  distance: 100
                  trackingAccuracy: 10
                  criteria: 'AllWithinDistance'
                  checkImmediate: true
      responses:
        '201':
          description: 'Successful subscription'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineUserDistanceSubscription'
                example:
                  userDistanceSubscription:
                    subscriptionType: 'UserDistanceSubscription'
                    clientCorrelator: '0123'
                    callbackReference: 'http://my.callback.com/user-distance/some-id'
                    referenceAddress:
                      - 'acr:10.0.0.3'
                    monitoredAddress:
                      - 'acr:10.0.0.1'
                      - 'acr:10.0.0.2'
                    distance: 100
                    trackingAccuracy: 10
                    criteria: 'AllWithinDistance'
                    checkImmediate: true

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
      callbacks:
        notification:
          '{$request.body#/userDistanceSubscription.callbackReference}':
            post:
              summary: 'Callback POST used to send a notification'
              description: 'Notification from Location service, content based user distance subscription type'
              operationId: distanceNotificationPOST
              requestBody:
                description: 'User Distance Notification'
                required: true
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        userDistanceNotification:
                          $ref: '#/components/schemas/UserDistanceNotification'
                      example:
                        - userDistanceNotification:
                            notificationType: 'UserDistanceNotification'
                            timeStamp:
                              seconds: 1673507343
                              nanoSeconds": 0
                            monitoredUsers: 
                              - user:
                                  address: 'acr:10.0.0.1'
                                  accessPointId: '001010000000000000000000000000001'
                                  zoneId: 'zone01'
                                  timeStamp:
                                    seconds: 1673507343
                                    nanoSeconds": 0
                                resourceURL: 'http://meAppServer.example.com/location/v3/queries/users'
                            distanceEvent: 'AllWithinDistance'
                            _links:
                              subscription:
                                href: 'http://meAppServer.example.com/location/v3/subscriptions/distance/subscription123'
              responses:
                '204':
                  $ref: '#/components/responses/204'
      x-swagger-router-controller: 'subscriptions'
  /subscriptions/distance/{subscriptionId}:
    get:
      tags:
        - 'location'
      summary: 'Retrieve user distance subscription information'
      description: 'The GET method is used to retrieve information about user distance subscription subscription.'
      operationId: distanceSubGET
      parameters:
        - $ref: '#/components/parameters/Path.SubscrId'
      responses:
        '200':
          description: 'Subscription information regarding subscription notifications'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineUserDistanceSubscription'
              example:
                userDistanceSubscription:
                  subscriptionType: 'UserDistanceSubscription'
                  clientCorrelator: '0123'
                  callbackReference: 'http://my.callback.com/user-distance/some-id'
                  referenceAddress:
                    - 'acr:10.0.0.3'
                  monitoredAddress:
                    - 'acr:10.0.0.1'
                    - 'acr:10.0.0.2'
                  distance: 100
                  trackingAccuracy: 10
                  criteria: 'AllWithinDistance'
                  checkImmediate: true

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'subscriptions'
    put:
      tags:
        - 'location'
      summary: 'Updates a user distance subscription information'
      description: 'The PUT method is used to update the existing user distance subscription.'
      operationId: distanceSubPUT
      requestBody:
        description: 'Subscription to be modified'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InlineUserDistanceSubscription'
              example:
                userDistanceSubscription:
                  subscriptionType: 'UserDistanceSubscription'
                  clientCorrelator: '0123'
                  callbackReference: 'http://my.callback.com/user-distance/some-id'
                  referenceAddress:
                    - 'acr:10.0.0.3'
                  monitoredAddress:
                    - 'acr:10.0.0.1'
                    - 'acr:10.0.0.2'
                  distance: 100
                  trackingAccuracy: 10
                  criteria: 'AllWithinDistance'
                  checkImmediate: true

      parameters:
        - $ref: '#/components/parameters/Path.SubscrId'
      responses:
        '200':
          description: 'Successful subscription to response to subscription notifications'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineUserDistanceSubscription'
              example:
                userDistanceSubscription:
                  subscriptionType: 'UserDistanceSubscription'
                  clientCorrelator: '0123'
                  callbackReference: 'http://my.callback.com/user-distance/some-id'
                  referenceAddress:
                    - 'acr:10.0.0.3'
                  monitoredAddress:
                    - 'acr:10.0.0.1'
                    - 'acr:10.0.0.2'
                  distance: 100
                  trackingAccuracy: 10
                  criteria: 'AllWithinDistance'
                  checkImmediate: true

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '406':
          $ref: '#/components/responses/406'
        '412':
          $ref: '#/components/responses/412'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'subscriptions'
    delete:
      tags:
        - 'location'
      summary: 'Cancel a subscription'
      description: 'The DELETE method is used to cancel the existing subscription.'
      operationId: distanceSubDELETE
      parameters:
        - $ref: '#/components/parameters/Path.SubscrId'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
      x-swagger-router-controller: 'subscriptions'

  /subscriptions/users:
    get:
      tags:
        - 'location'
      summary: 'Retrieves information about the subscriptions for the requestor'
      description: 'The GET method is used to request information about the subscriptions for the requestor. '
      operationId: userSubListGET
      parameters:
        - name: subscription_type
          in: query
          description: Filter subscriptions by type
          schema:
            type: string
            enum: [event, periodic]
          required: false
        - name: address
          in: query
          description: Address of the user
          schema:
            type: string
          required: false
      responses:
        '200':
          description: 'Response to retrieve user tracking subscriptions'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InlineNotificationSubscriptionList'
                example:
                  - notificationSubscriptionList:
                      subscription:
                        - href: 'http://meAppServer.example.com/location/v2/subscriptions/users/subscription123'
                          subscriptionType: 'UserLocationEventSubscription'
                        - href: 'http://meAppServer.example.com/location/v2/subscriptions/users/subscription456'
