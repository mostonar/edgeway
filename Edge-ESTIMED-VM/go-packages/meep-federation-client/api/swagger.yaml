        name:
          type: string
          description: Name of the category.
        version:
          type: string
          description: Category version.
      description: This type represents the category reference.
      example:
        name: name
        href: href
        id: id
        version: version
    TransportDescriptor:
      title: TransportDescriptor
      required:
      - name
      - protocol
      - security
      - type
      - version
      type: object
      properties:
        name:
          type: string
          description: The name of this transport.
        description:
          type: string
          description: Human-readable description of this transport.
        protocol:
          type: string
          description: The name of the protocol used. Shall be set to HTTP for a REST
            API.
        security:
          $ref: '#/components/schemas/SecurityInfo'
        type:
          $ref: '#/components/schemas/TransportTypes'
        version:
          type: string
          description: The version of the protocol used.
        implSpecificInfo:
          type: string
          description: Additional implementation specific details of the transport.
      example:
        implSpecificInfo: implSpecificInfo
        protocol: protocol
        security:
          (extensions):
          - (extensions)
          - (extensions)
          oAuth2Info:
            tokenEndpoint: http://example.com/aeiou
            grantTypes:
            - SEE_DESCRIPTION
            - SEE_DESCRIPTION
        name: name
        description: description
        type: REST_HTTP
        version: version
    TransportTypes:
      type: string
      description: The enumeration TransportType represents types of transports.
      enum:
      - REST_HTTP
      - MB_TOPIC_BASED
      - MB_ROUTING
      - MB_PUBSUB
      - RPC
      - RPC_STREAMING
      - WEBSOCKET
      x-etsi-ref: 8.1.6.4
      x-etsi-mec-extensible: true
      x-etsi-mec-enumeration-table:
      - value: REST_HTTP
        description: "RESTful API using HTTP (as defined in IETF RFC 9110 [11])."
      - value: MB_TOPIC_BASED
        description: "Topic-based message bus which routes messages to receivers based\
          \ on subscriptions, if a pattern passed on subscription matches the topic\
          \ of the message. EXAMPLE MQTT (see [i.4])."
      - value: MB_ROUTING
        description: "Routing-based message bus which routes messages to receivers\
          \ based on subscriptions, if a key passed on subscription is equal to the\
          \ key of the message."
      - value: MB_PUBSUB
        description: Publish-subscribe based message bus which distributes messages
          to all subscribers.
      - value: RPC
        description: "Remote procedure call. EXAMPLE GRPC (see [i.5])."
      - value: RPC_STREAMING
        description: "Remote procedure call supporting streams of requests and responses.\
          \ EXAMPLE GRPC (see [i.5])."
      - value: WEBSOCKET
        description: "Websockets as defined in IETF RFC 6455 [12]."
    SecurityInfo:
      type: object
      properties:
        oAuth2Info:
          $ref: '#/components/schemas/OAuth2Info'
        (extensions):
          minItems: 0
          type: array
          description: "'Extensions for alternative transport mechanisms. These extensions\
            \ depend on the actual transport, and are out of scope of the present\
            \ document. For instance, such extensions may be used to signal the necessary\
            \ parameters for the client to use TLSbased authorization defined for\
            \ alternative transports (see ETSI GS MEC 009 [5] for more information).'\n"
          items:
            type: string
      example:
        (extensions):
        - (extensions)
        - (extensions)
        oAuth2Info:
          tokenEndpoint: http://example.com/aeiou
          grantTypes:
          - SEE_DESCRIPTION
          - SEE_DESCRIPTION
    OAuth2Info:
      required:
      - grantTypes
      type: object
      properties:
        grantTypes:
          minItems: 0
          type: array
          description: |
            "List of supported OAuth 2.0 grant types.\nEach entry shall be one of the following permitted values:\nOAUTH2_AUTHORIZATION_CODE (Authorization code grant type)\nOAUTH2_IMPLICIT_GRANT\n \t(Implicit grant type)\nOAUTH2_RESOURCE_OWNER\n\t(Resource owner password credentials grant type) \nOAUTH2_CLIENT_CREDENTIALS\n\t(Client credentials grant type)\nOnly the value \"OAUTH2_CLIENT_CREDENTIALS\" is supported in the present document. "
          items:
            type: string
            enum:
            - SEE_DESCRIPTION
        tokenEndpoint:
          type: string
          description: The token endpoint. Shall be present unless the grant type
            is OAUTH2_IMPLICIT_GRANT.
          format: uri
      description: "Parameters related to use of OAuth 2.0. Shall be present in case\
        \ OAuth 2.0 (see IETF RFC 6749 [13]) is supported to secure the provision\
        \ of the service over the transport.\n"
      example:
        tokenEndpoint: http://example.com/aeiou
        grantTypes:
        - SEE_DESCRIPTION
        - SEE_DESCRIPTION
    SerializerType:
      title: SerializerType
      type: string
      description: "The enumeration SerializerType represents types of serializers.\
        \ This enumeration shall be extensible.\nNOTE: The enumeration values above\
        \ shall represent the serializers as defined by the referenced specifications.\
        \ \n"
      enum:
      - JSON
      - XML
      - PROTOBUF3
    fed_resources_systems_body:
      type: object
      properties:
        SystemInfo:
          $ref: '#/components/schemas/SystemInfo'
