          description: >-
            Represents a subscription to the notifications from the MEC platform.
          required: true
          style: simple
          schema:
            type: string
      responses:
        '200':
          description: >-
            Upon success, a response message content containing the requested subscription is returned.
          headers: {}
          content:
            application/json:
              schema:
