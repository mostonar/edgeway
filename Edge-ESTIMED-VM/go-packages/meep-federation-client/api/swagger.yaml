        subscription:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionLinkList_subscription'
          x-etsi-mec-cardinality: 0..N
          x-etsi-mec-origin-type: Structure (inlined)
      example:
        _links:
          self:
            href: http://example.com/aeiou
        subscription:
        - subscriptionType: subscriptionType
          href: http://example.com/aeiou
        - subscriptionType: subscriptionType
          href: http://example.com/aeiou
    SubscriptionLinkList_subscription:
      required:
      - href
      - subscriptionType
      type: object
      properties:
        href:
          type: string
          description: The URI referring to the subscription.
          format: uri
          x-etsi-mec-cardinality: "1"
          x-etsi-mec-origin-type: URI
        subscriptionType:
          type: string
          description: "Type of the subscription. The string shall be set according\
            \ to the \"subscriptionType\" attribute of the associated subscription\
            \ data type defined in 6.3.2, 6.3.3. and 6.3.5:\n“AssocStaSubscription”\
            \n“StaDataRateSubscription”\n“MeasurementReportSubscription”"
          x-etsi-mec-cardinality: "1"
          x-etsi-mec-origin-type: String
      example:
        subscriptionType: subscriptionType
        href: http://example.com/aeiou
    MecHostInformation:
      title: MecHostInformation
      required:
      - hostId
      type: object
      properties:
        hostName:
          type: string
          description: Human-readable name of MEC host
        hostId:
          type: string
          description: Deployment-specific information to identify a MEC host
      description: The data type represents the parameters of MEC host information
      example:
        hostName: hostName
        hostId: hostId
    TransportsSupported:
      title: TransportsSupported
      required:
      - serializers
      type: object
      properties:
        transport:
          $ref: '#/components/schemas/TransportDescriptor'
        serializers:
          type: array
          description: "Information about the serializers in this binding, as defined\
            \ in the SerializerTypes type in ETSI GS MEC 011"
          items:
            $ref: '#/components/schemas/SerializerType'
      description: Indicates transports and serialization formats supported made available
        to the service-consuming application. Defaults to REST + JSON if absent.
      example:
        serializers:
        - JSON
        - JSON
        transport:
          implSpecificInfo: implSpecificInfo
          protocol: protocol
          security:
            (extensions):
            - (extensions)
            - (extensions)
            oAuth2Info:
              tokenEndpoint: http://example.com/aeiou
              grantTypes:
              - SEE_DESCRIPTION
              - SEE_DESCRIPTION
          name: name
          description: description
          type: REST_HTTP
          version: version
    CategoryRef:
      title: CategoryRef
