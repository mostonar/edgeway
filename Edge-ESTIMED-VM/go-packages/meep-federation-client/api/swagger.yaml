openapi: 3.0.0
info:
  title: ETSI GS MEC 040 - MEC Federation enablement APIs
  description: The ETSI MEC ISG MEC040 Federation enablement API described using OpenAPI
  contact:
    url: https://forge.etsi.org/rep/mec/gs040-fed-enablement-api
  license:
    name: BSD-3-Clause
    url: https://forge.etsi.org/legal-matters
  version: 3.2.1
externalDocs:
  description: "ETSI GS MEC 040 Federation enablement API, v3.2.1"
  url: https://www.etsi.org/deliver/etsi_gs/MEC/001_099/040/03.02.01_60/gs_MEC040v030201p.pdf
servers:
- url: https://localhost/sandboxname/sandboxname/sandboxname/sandboxname/fed_enablement/v1
tags:
- name: systemInfo
- name: subscription
- name: fedServiceInfo
paths:
  /fed_resources/systems:
    get:
      tags:
      - systemInfo
      summary: Retrieve a list of systems resources (see clause 6 for data model)
        of federation members.
      description: "The GET method retrieves the information of a list of systems\
        \ resources of federation members. This method is typically used in the sequence\
        \ of \"MEC system discovery\" as described in clause 5.2.2.2. The method shall\
        \ comply with the URI query parameters, request and response data structures,\
        \ and response codes, as specified in Tables 7.3.3.1-1 and 7.3.3.1-2."
      operationId: systeminfoGET
      parameters:
      - name: systemId
        in: query
        description: Identifier of the MEC system.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        x-exportParamName: Query.systemId
      - name: systemName
        in: query
        description: The name of the MEC system.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        x-exportParamName: Query.systemName
      - name: systemProvider
        in: query
        description: Provider of the MEC system.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        x-exportParamName: Query.systemProvider
      responses:
        "200":
          description: It is used to indicate that the query for retrieving systems
            resource(s) is successful. Response body containing one or multiple systems
            resources shall be returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemInfo'
                x-content-type: application/json
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - systemInfo
      summary: Create new systems resource for a given MEC system.
      description: "The POST method creates the information of systems resources to\
        \ the MEC federator. This method is typically used in the sequence of \"Registration\
        \ of MEC system to the federation\" as described in clause 5.2.2.1. The method\
        \ shall comply with the URI query parameters, request and response data structures,\
        \ and response codes, as specified in Tables\_7.3.3.4-1 and 7.3.3.4-2."
      operationId: systeminfoPOST
      requestBody:
        description: Entity body in the request contains SystemInfo to be created.
          The attribute "systemId" shall be absent.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/fed_resources_systems_body'
        required: true
      responses:
        "201":
          description: |-
            It is used to indicate that the systems resource is successfully created.

            The HTTP response includes a "Location" HTTP header that contains the URI of the created resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fed_resources_systems_body'
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /fed_resources/systems/{systemId}:
    get:
      tags:
      - systemInfo
      summary: Retrieve the systems resource of the federation member with systemId
        as its system identifier.
      description: "The GET method retrieves the systems resource information. This\
        \ method is typically used in the sequence of \"MEC system discovery\" as\
        \ described in clause 5.2.2.2. The method shall comply with the URI query\
        \ parameters, request and response data structures, and response codes, as\
        \ specified in Tables 7.4.3.1-1 and 7.4.3.1-2."
      operationId: systeminfoByIdGET
      parameters:
      - name: systemId
        in: path
        description: Identifier of the MEC system.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        x-exportParamName: Path.systemId
      responses:
        "200":
          description: It is used to indicate that the query for retrieving systems
            resource is successful. Response body containing one systems resource
            shall be returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fed_resources_systems_body'
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
      - systemInfo
      summary: Delete the systems resource for a given MEC system.
      description: "The DELETE method deletes the information of systems resources\
        \ stored in the MEF. This method is typically used in the sequence of \"Deregistration\
        \ of MEC system to the federation\" as described in clause 5.2.2.1.1. The\
        \ method shall comply with the URI query parameters, request and response\
        \ data structures, and response codes, as specified in Tables 7.4.3.5-1 and\
        \ 7.4.3.5-2."
      operationId: systeminfoByIdDELETE
      parameters:
      - name: systemId
        in: path
        description: Identifier of the MEC system.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        x-exportParamName: Path.systemId
      responses:
        "204":
          description: No Content
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      tags:
      - systemInfo
      summary: Update the systems resource for a given MEC system.
      description: "The PATCH method updates the information of systems resources\
        \ stored in the MEC federator through previous registration. This method is\
        \ typically used in the sequence of \"Update of MEC system to the federation\"\
        \ as described in clause 5.2.2.2. The method shall comply with the URI query\
        \ parameters, request and response data structures, and response codes, as\
        \ specified in Tables 7.4.3.3-1 and 7.4.3.3-2."
      operationId: systeminfoByIdPATCH
      parameters:
      - name: systemId
        in: path
        description: Identifier of the MEC system.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        x-exportParamName: Path.systemId
      requestBody:
        description: It contains attributes to be update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/systems_systemId_body'
        required: true
      responses:
        "200":
          description: It is used to indicate that the systems resource is successfully
            updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fed_resources_systems_body'
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /subscriptions:
    get:
      tags:
      - subscription
      summary: Retrieve information on subscriptions for notifications
      description: Queries information on subscriptions for notifications
      operationId: subscriptionsGET
      parameters:
      - name: subscriptionType
        in: query
        description: Query parameter is used to filter a specific subscription type
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: systemId
        in: query
        description: Identifier of the MEC system
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        "200":
          description: Response body contains the list of links to requestor's subscriptions
            is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionLinkList'
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - subscription
      summary: Create a new subscription
      description: Creates a new subscription to to MEF
      operationId: subscriptionPOST
      requestBody:
        description: Subscription to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUpdateNotificationSubscription'
        required: true
      responses:
        "201":
          description: Successful subscription response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUpdateNotificationSubscription'
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /subscriptions/{subscriptionId}:
    get:
      tags:
      - subscription
      summary: Retrieve information on current specific subscription
      description: "Queries information about an existing subscription, identified\
        \ by its  self-referring URI returned on creation\""
      operationId: subscriptionGET
      parameters:
      - name: subscriptionId
        in: path
        description: "Subscription Id, specifically the \\\"self\\\" returned in the\
          \ subscription  request"
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uri
      responses:
        "200":
          description: Subscription information regarding subscription notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUpdateNotificationSubscription'
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
      - subscription
      summary: Modify an existing subscription
      description: "Updates an existing subscription, identified by its self-referring\
        \ URI returned on creation"
      operationId: subscriptionPUT
      parameters:
      - name: subscriptionId
        in: path
        description: "Subscription Id, specifically the \\\"self\\\" returned in the\
          \ subscription  request\""
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uri
      requestBody:
        description: Subscription to be modified
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUpdateNotificationSubscription'
        required: true
      responses:
        "200":
          description: Successful subscription modification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemUpdateNotificationSubscription'
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    delete:
      tags:
      - subscription
      summary: Cancel an existing subscription
      description: "Cancels an existing subscription, identified by its self-referring\
        \ URI  returned on creation (initial POST)"
      operationId: subscriptionDELETE
      parameters:
      - name: subscriptionId
        in: path
        description: "Subscription Id, specifically the \\\"self\\\" returned in the\
          \ subscription  request\""
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uri
      responses:
        "204":
          description: No Content
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /fed_resources/systems/{systemId}/services:
    get:
      tags:
      - fedServiceInfo
      summary: Retrieves the information of all MEC services hosted by the MEC system
      description: Retrieves the information of all MEC services hosted by the MEC
        system associated with the systemId
      operationId: servicesGET
      parameters:
      - name: systemId
        in: path
        description: Identifier of the MEC system.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        x-exportParamName: Path.systemId
      - name: seInstancerId
        in: query
        description: Indicator of a MEC service offered for MEC federation.
        required: false
        style: form
        explode: true
        schema:
          type: string
        x-exportParamName: Query.seInstancerId
      - name: serName
        in: query
        description: The name of the service.
        required: false
        style: form
        explode: true
        schema:
          type: string
        x-exportParamName: Query.serName
      - name: serCategory
        in: query
        description: A Category reference.
        required: false
        style: form
        explode: true
        schema:
          type: string
        x-exportParamName: Query.serCategory
      responses:
        "200":
          description: It is used to indicate that the query for retrieving systems
            resource(s) is successful. Response body containing one or multiple systems
            resources shall be returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FedServiceInfo'
                x-content-type: application/json
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /fed_resources/systems/{systemId}/services/{serviceId}:
    get:
      tags:
      - fedServiceInfo
      summary: Retrieves the information of a specific MEC service hosted by the MEC
        system associated with the systemId and serviceId
      description: Retrieves the information of a specific MEC service hosted by the
        MEC system associated with the systemId and serviceId
      operationId: serviceGET
      parameters:
      - name: systemId
        in: path
        description: Identifier of the MEC system.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        x-exportParamName: Path.systemId
      - name: serviceId
        in: path
        description: Service identifier.
        required: true
        style: simple
        explode: false
        schema:
          type: string
        x-exportParamName: Path.serviceId
      responses:
        "200":
          description: "Upon success, a response body containing data type describing\
            \ the specific subscription data type is returned."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FedServiceInfo'
        "400":
          description: "Bad Request: used to indicate that incorrect parameters were\
            \ passed to the request."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: "Unauthorized: used when the client did not submit credentials."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "403":
          description: "Forbidden: operation is not allowed given the current status\
            \ of the resource."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "404":
          description: "Not Found: used when a client provided a URI that cannot be\
            \ mapped to a valid resource URI."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference according to IETF RFC 3986 that identifies
            the problem type
          format: uri
        title:
          type: string
          description: "A short, human-readable summary of the problem type"
        status:
          type: integer
          description: The HTTP status code for this occurrence of the problem
          format: uint32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of
            the problem
          x-etsi-mec-cardinality: 0..1
          x-etsi-mec-origin-type: String
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of
            the problem
          format: uri
    FedServiceInfo:
      title: FedServiceInfo
      required:
      - mecHostInformation
      - serviceInfo
      - systemId
      type: object
      properties:
        systemId:
          type: string
          description: Identifier of the MEC system.
        mecHostInformation:
          $ref: '#/components/schemas/MecHostInformation'
        serviceInfo:
          $ref: '#/components/schemas/ServiceInfo'
      description: This data type represents the general information of a MEC service
        in a MEC federation. The attributes of the FedServiceInfo shall follow the
        indications provided  in Table 6.2.4-1.
      example:
        systemId: systemId
        serviceInfo:
          serCategory:
            name: name
            href: href
            id: id
            version: version
          transportsSupported:
          - serializers:
            - JSON
            - JSON
            transport:
              implSpecificInfo: implSpecificInfo
              protocol: protocol
              security:
                (extensions):
                - (extensions)
                - (extensions)
                oAuth2Info:
                  tokenEndpoint: http://example.com/aeiou
                  grantTypes:
                  - SEE_DESCRIPTION
                  - SEE_DESCRIPTION
              name: name
              description: description
              type: REST_HTTP
              version: version
          - serializers:
            - JSON
            - JSON
            transport:
              implSpecificInfo: implSpecificInfo
              protocol: protocol
              security:
                (extensions):
                - (extensions)
                - (extensions)
                oAuth2Info:
                  tokenEndpoint: http://example.com/aeiou
                  grantTypes:
                  - SEE_DESCRIPTION
                  - SEE_DESCRIPTION
              name: name
              description: description
              type: REST_HTTP
              version: version
          serName: serName
          version: version
        mecHostInformation:
          hostName: hostName
          hostId: hostId
    SystemInfo:
      title: SystemInfo
      required:
      - systemId
      - systemName
      - systemProvider
      type: object
      properties:
        systemId:
          type: string
          description: "Identifier of the MEC system. For the uniqueness of the identifier\
            \ across the federated MEC systems, UUID format [i.9] is recommended.\
            \ Shall be absent in POST request, and present otherwise."
        systemName:
          type: string
          description: The name of the MEC system. This is how the MEC system identifies
            other MEC systems
        systemProvider:
          type: string
          description: Provider of the MEC system.
      description: This type represents an information provided by the MEC orchestrator
        as a part of the "Registration of MEC system to the federation
      example:
        systemId: systemId
        systemName: systemName
        systemProvider: systemProvider
    ServiceInfo:
      title: SystemInfo
      required:
      - serName
      - transportsSupported
      - version
      type: object
      properties:
