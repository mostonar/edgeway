# Default values for meep-tiny-iot-mn-cse
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deployment:
  replicas: 1
  port: 3005
  protocol: TCP
  dependencies:
    system:
      {{- if not .IsMepService }}
      - kube-dns
      {{- end }}
    namespace:

image:
  repository: meep-docker-registry:30001/meep-tinyiot-mn-cse
  tag: latest
  pullPolicy: Always
  # entrypointScript: /entrypoint.sh
  env:
    MEAS_REP_UE_PERIODIC_TRIGGER_INTERVAL: 1s
    NR_MEAS_REP_UE_PERIODIC_TRIGGER_INTERVAL: 1s
    MEEP_INSTANCE_ID: {{.InstanceId}}
    MEEP_SANDBOX_NAME: {{.SandboxName}}
    MEEP_SVC_PATH: /tinyiot-mn-cse
    MEEP_HOST_URL: {{.HostUrl}}
    SERVER_TYPE: MN_CSE
    SERVER_PORT: "3005"
    CSE_BASE_NAME: "tinyiot-mn-cse"
    CSE_BASE_RI: "tinyiot-mn-cse"
    MQTT_HOST: "{{.LocationName}}-meep-mosquitto"
    MQTT_PORT: 1883
    MQTT_USERNAME: "test"
    MQTT_PASSWORD: "mqttq"
    MEEP_TOPIC: {{.SandboxName}}/tinyiot-mn-cse
    {{- if .IsMepService }}
    MEEP_LOCATION_NAME: {{.LocationName}}
    {{- end }}
    {{- if eq .AppEnablement "local" }}
    MEEP_APP_ENABLEMENT: {{.LocationName}}-meep-app-enablement
    {{- else if eq .AppEnablement "global" }}
    MEEP_APP_ENABLEMENT: meep-app-enablement
    {{- end }}
    {{- range .Env}}
    {{.}}
    {{- end}}

service:
  {{- if .IsMepService }}
  name: {{.LocationName}}-meep-tinyiot-mn-cse
  {{- else }}
  name: meep-tinyiot-mn-cse
  {{- end }}
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  hosts:
    - name: ''
      paths:
        {{- if .IsMepService }}
        - /{{.SandboxName}}/{{.LocationName}}/meep-tinyiot-mn-cse
        {{- else }}
        - /{{.SandboxName}}/tinyiot-mn-cse
        {{- end }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ .HttpsOnly }}
    {{- if .IsMepService }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/{{.SandboxName}}/{{.LocationName}}/meep-tinyiot-mn-cse(/|$)(.*)$ /$2 break;
    {{- else }}
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^/{{.SandboxName}}/meep-tinyiot-mn-cse(/|$)(.*)$ /$2 break;
    {{- end }}
    {{- if .AuthEnabled }}
    nginx.ingress.kubernetes.io/auth-url: {{ if .HttpsOnly }}https{{ else }}http{{ end }}://$http_host/auth/v1/authenticate?svc=meep-tinyiot-mn-cse&sbox={{.SandboxName}}&mep={{.LocationName}}
    {{- end }}
  labels: {}
  tls:

prometheus:
  monitor:
    enabled: true
    port: 9000
    interval: 10s
    additionalLabels: {}
    relabelings: []
    scrapeTimeout: 5s
    
codecov:
  enabled: false
  location: "<WORKDIR>/codecov/meep-tiny-iot-mn-cse"

meepOrigin: core