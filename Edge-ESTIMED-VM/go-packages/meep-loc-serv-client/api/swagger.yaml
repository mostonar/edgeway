      callbacks:
        notification:
          '{$request.body#/userAreaSubscription.callbackReference}':
            post:
              summary: Callback POST used to send a notification
              description: "Notification from Location service, content based on subscription\
                \ type"
              operationId: areaNotificationPOST
              requestBody:
                description: Subscription notification
                content:
                  application/json:
                    schema:
                      type: object
                      properties:
                        userAreaNotification:
                          $ref: '#/components/schemas/InlineUserAreaNotification'
                      example:
                      - userAreaNotification:
                          notificationType: UserAreaNotification
                          timeStamp:
                            seconds: 1673507343
                            nanoSeconds": 0
                          address: acr:10.0.0.1
                          userLocationEvent: ENTERING_AREA_EVENT
                          _links:
                            subscription:
                              href: http://meAppServer.example.com/location/v2/subscriptions/area/subscription123
                required: true
              responses:
                "204":
