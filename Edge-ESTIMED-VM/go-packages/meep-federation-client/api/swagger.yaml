            version: version
        - serializers:
          - JSON
          - JSON
          transport:
            implSpecificInfo: implSpecificInfo
            protocol: protocol
            security:
              (extensions):
              - (extensions)
              - (extensions)
              oAuth2Info:
                tokenEndpoint: http://example.com/aeiou
                grantTypes:
